<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/default :: layout('たこやき神社', ~{::main}, ~{:: headStyles})}"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>長堀橋たこやき神社</title>
    <th:block th:fragment="headStyles">
        <link rel="stylesheet" th:href="@{/css/fortune.css}">
    </th:block>
</head>

<body>
    <main class="flex-grow-1 fortune-page">

        <!-- ヒーローバナー -->
        <div class="fortune-hero">
            <div class="container">
                <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🐙</div>
                <h1>長堀橋たこやき神社</h1>
                <p class="mb-0">今日の運勢と、あなたにぴったりのスポットをお伝えします</p>
            </div>
        </div>

        <div class="container py-5">
            <div class="omikuji-container">

                <!-- ===== 未ログイン ===== -->
                <div sec:authorize="isAnonymous()" class="login-cta-card">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">🐙</div>
                    <h2 class="h5 fw-bold mb-2">ログインしておみくじを引こう</h2>
                    <p class="text-secondary small mb-4">
                        おみくじはログイン会員限定の機能です。<br>
                        会員登録は無料です。
                    </p>
                    <div class="d-flex flex-column gap-2 align-items-center">
                        <a th:href="@{/login(returnUrl=@{/fortune})}" class="btn btn-sm btn-outline-secondary"
                            style="border-color: #d1d5db; color: #374151; border-radius: 0.5rem; padding: 0.4rem 1.5rem;">
                            <i class="bi bi-box-arrow-in-right me-1"></i>ログインする
                        </a>
                        <a th:href="@{/register}" class="btn btn-sm btn-outline-secondary"
                            style="border-color: #d1d5db; color: #374151; border-radius: 0.5rem; padding: 0.4rem 1.5rem;">
                            <i class="bi bi-person-plus me-1"></i>新規登録する
                        </a>
                    </div>
                </div>

                <!-- ===== ログイン済み ===== -->
                <div sec:authorize="isAuthenticated()">

                    <!-- ポイント表示 -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-secondary small">
                            <i class="bi bi-person-circle me-1"></i>
                            <span th:text="${profile?.displayName}">ユーザー名</span> さん
                        </span>
                        <span class="point-badge">
                            <i class="bi bi-star-fill"></i>
                            <span th:text="${profile?.point + ' pt'}">0 pt</span>
                        </span>
                    </div>

                    <!-- 気分選択（コントローラーで引き済みはリダイレクト済みのため常に表示） -->
                    <div class="draw-card" id="drawSection">
                        <div class="omikuji-tube" id="omikujiTube">
                            <div class="slip-peek" id="slipPeek"></div>
                            <div class="omikuji-tube-top"></div>
                            <div class="omikuji-tube-body">おみくじ</div>
                        </div>
                        <p class="fw-bold mb-1" id="drawPrompt" style="font-size: 0.95rem;">今日の気分はどれに近い？</p>
                        <p class="text-secondary mb-3" style="font-size: 0.8rem;">※ 1日1回まで引けます</p>

                        <form th:action="@{/fortune/draw}" method="post" id="drawForm">
                            <div class="mood-grid mb-3">
                                <div class="mood-option" th:each="entry : ${moodSelection}">
                                    <input type="radio" name="themeId" th:id="'mood-' + ${entry.key}"
                                        th:value="${entry.key}">
                                    <label th:for="'mood-' + ${entry.key}">
                                        <span>🐙</span>
                                        <span th:text="${entry.value}">気分</span>
                                    </label>
                                </div>
                            </div>
                            <button type="submit" class="btn-draw" id="drawBtn" disabled>
                                おみくじを引く
                            </button>

                        </form>
                    </div>

                </div>
                <!-- /isAuthenticated -->

            </div>
            <!-- /omikuji-container -->
        </div>

        <script>
            (function () {
                var form = document.getElementById('drawForm');
                var drawBtn = document.getElementById('drawBtn');
                var tube = document.getElementById('omikujiTube');
                var prompt = document.getElementById('drawPrompt');
                if (!form || !drawBtn || !tube) return;

                // ラジオが選択されたらボタンを有効化
                form.querySelectorAll('input[type="radio"]').forEach(function (radio) {
                    radio.addEventListener('change', function () {
                        drawBtn.disabled = false;
                    });
                });

                function phase3Submit() {
                    form.submit();
                }

                function phase2Reveal() {
                    tube.classList.remove('shaking');
                    tube.classList.add('revealing');
                    if (prompt) prompt.textContent = 'おみくじが出てきた…！';
                    drawBtn.textContent = '結果を確認中…';
                    setTimeout(phase3FadeOut, 1200);
                }

                function phase3FadeOut() {
                    tube.classList.add('submitting');
                    setTimeout(phase3Submit, 450);
                }

                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    drawBtn.disabled = true;
                    drawBtn.textContent = '振っています…';
                    if (prompt) prompt.textContent = 'おみくじを振っています…';

                    // ボタン背景プログレス開始（reflow を挟んで transition を確実に発火させる）
                    drawBtn.getBoundingClientRect();
                    drawBtn.classList.add('in-progress');

                    // フェーズ1: シェイク（0.7s × 3 = 2.1s）
                    tube.classList.add('shaking');
                    setTimeout(phase2Reveal, 2200);
                });
            })();
        </script>

    </main>
</body>

</html>
