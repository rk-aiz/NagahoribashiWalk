<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/default :: layout('退会完了', ~{::main}, ~{:: headStyles})}">

<head>
	<title>退会完了</title>
	<th:block th:fragment="headStyles">
		<style>
			.complete-card {
				max-width: 440px;
				margin: 0 auto;
				background: #ffffff;
				border-radius: 1rem;
				padding: 2.5rem 2rem;
				box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
				text-align: center;
			}

			.complete-icon {
				width: 72px;
				height: 72px;
				margin: 0 auto 1.25rem;
			}

			.complete-icon svg {
				width: 100%;
				height: 100%;
			}

			.complete-title {
				font-size: 1.35rem;
				font-weight: 700;
				color: #1e293b;
				margin-bottom: 0.35rem;
			}

			.complete-message {
				font-size: 0.875rem;
				color: #64748b;
				margin-bottom: 1.75rem;
				line-height: 1.6;
			}

			.btn-home {
				display: block;
				width: 100%;
				padding: 0.65rem;
				border-radius: 0.6rem;
				font-size: 0.95rem;
				font-weight: 600;
				color: #ffffff;
				background-color: #64748b;
				text-align: center;
				text-decoration: none;
				transition: background-color 0.15s;
			}

			.btn-home:hover {
				background-color: #475569;
				color: #ffffff;
			}
		</style>
	</th:block>
</head>

<body>
	<main class="flex-grow-1 d-flex align-items-center py-5"
		style="background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);">
		<div class="container">
			<div class="complete-card">

				<!-- 完了アイコン -->
				<div class="complete-icon">
					<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<circle cx="12" cy="12" r="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
						<path d="M7.5 12.5l3 3 6-6" stroke="#16a34a" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round" />
					</svg>
				</div>

				<h1 class="complete-title">退会が完了しました</h1>
				<p class="complete-message">
					ご利用ありがとうございました。<br>
					またのご利用をお待ちしております。
				</p>

				<a th:href="@{/}" class="btn-home">
					<i class="bi bi-house me-1"></i>トップへ戻る
				</a>

			</div>
		</div>
	</main>
</body>

</html>
