<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/default :: layout('退会確認', ~{::main}, ~{:: headStyles})}">

<head>
	<title>退会確認</title>
	<th:block th:fragment="headStyles">
		<style>
			.unsubscribe-card {
				max-width: 440px;
				margin: 0 auto;
				background: #ffffff;
				border-radius: 1rem;
				padding: 2.5rem 2rem;
				box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
			}

			.warning-icon {
				width: 72px;
				height: 72px;
				margin: 0 auto 1.25rem;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.warning-icon svg {
				width: 100%;
				height: 100%;
			}

			.unsubscribe-title {
				font-size: 1.35rem;
				font-weight: 700;
				color: #dc2626;
				text-align: center;
				margin-bottom: 0.35rem;
			}

			.unsubscribe-subtitle {
				font-size: 0.875rem;
				color: #64748b;
				text-align: center;
				margin-bottom: 1.5rem;
			}

			.deletion-notice {
				background-color: #fff1f2;
				border: 1px solid #fecdd3;
				border-radius: 0.75rem;
				padding: 1rem 1.25rem;
				margin-bottom: 1.5rem;
			}

			.deletion-notice p {
				font-size: 0.875rem;
				font-weight: 600;
				color: #b91c1c;
				margin-bottom: 0.5rem;
			}

			.deletion-notice ul {
				list-style: none;
				padding: 0;
				margin: 0;
			}

			.deletion-notice ul li {
				font-size: 0.85rem;
				color: #dc2626;
				padding: 0.15rem 0;
			}

			.deletion-notice ul li::before {
				content: "• ";
			}

			.agree-label {
				display: flex;
				align-items: center;
				gap: 0.6rem;
				font-size: 0.875rem;
				color: #374151;
				cursor: pointer;
				margin-bottom: 1.5rem;
			}

			.agree-label input[type="checkbox"] {
				width: 1.1rem;
				height: 1.1rem;
				flex-shrink: 0;
				cursor: pointer;
				accent-color: #dc2626;
			}

			.btn-unsubscribe {
				width: 100%;
				padding: 0.65rem;
				border: none;
				border-radius: 0.6rem;
				font-size: 0.95rem;
				font-weight: 600;
				color: #ffffff;
				background-color: #f87171;
				cursor: pointer;
				transition: background-color 0.15s, opacity 0.15s;
				margin-bottom: 0.75rem;
			}

			.btn-unsubscribe:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}

			.btn-unsubscribe:not(:disabled):hover {
				background-color: #ef4444;
			}

			.btn-cancel {
				display: block;
				width: 100%;
				padding: 0.65rem;
				border: 1px solid #e2e8f0;
				border-radius: 0.6rem;
				font-size: 0.95rem;
				font-weight: 500;
				color: #374151;
				background: #ffffff;
				text-align: center;
				text-decoration: none;
				transition: background-color 0.15s;
			}

			.btn-cancel:hover {
				background-color: #f8fafc;
				color: #374151;
			}
		</style>
	</th:block>
</head>

<body>
	<main class="flex-grow-1 d-flex align-items-center py-5"
		style="background: linear-gradient(135deg, #fff1f2 0%, #fef2f2 50%, #fff7ed 100%);">
		<div class="container">
			<div class="unsubscribe-card">

				<!-- 警告アイコン -->
				<div class="warning-icon">
					<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
							fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-linejoin="round" />
						<line x1="12" y1="9" x2="12" y2="13" stroke="#dc2626" stroke-width="2"
							stroke-linecap="round" />
						<line x1="12" y1="17" x2="12.01" y2="17" stroke="#dc2626" stroke-width="2"
							stroke-linecap="round" />
					</svg>
				</div>

				<h1 class="unsubscribe-title">退会処理</h1>
				<p class="unsubscribe-subtitle">本当に退会しますか？</p>

				<!-- 削除される情報 -->
				<div class="deletion-notice">
					<p>退会すると以下の情報が削除されます</p>
					<ul>
						<li>登録されている会員情報</li>
						<li>お気に入りに登録したスポット</li>
						<li>投稿したレビュー</li>
					</ul>
				</div>

				<!-- 同意チェックボックス + 退会ボタン -->
				<form th:action="@{/unsubscribe}" method="post" id="unsubscribe-form">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

					<label class="agree-label">
						<input type="checkbox" id="agree-checkbox">
						上記の内容を確認し、退会することに同意します
					</label>

					<button type="submit" class="btn-unsubscribe" id="submit-btn" disabled>
						退会する
					</button>
				</form>

				<a th:href="@{/mypage}" class="btn-cancel">キャンセル</a>

			</div>
		</div>

		<script>
			(function () {
				var checkbox = document.getElementById('agree-checkbox');
				var submitBtn = document.getElementById('submit-btn');

				checkbox.addEventListener('change', function () {
					submitBtn.disabled = !this.checked;
				});
			})();
		</script>
	</main>
</body>

</html>
