<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 長堀橋さんぽ</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .btn-register:hover {
            background-color: #f8fafc;
            border-color: #d1d5db;
            color: #374151;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);">

    <!--/* シンプルヘッダー */-->
    <header class="bg-white border-bottom py-3">
        <div class="container">
            <a th:href="@{/}" class="text-decoration-none fw-bold d-inline-flex align-items-center"
                style="font-family: 'Nunito', sans-serif; color: #1e293b; font-size: 1.1rem;">
                <i class="bi bi-geo-alt me-1" style="color: #2563eb;"></i>長堀橋さんぽ
            </a>
        </div>
    </header>

    <!--/* メインコンテンツ */-->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="w-100" style="max-width: 440px; padding: 0 1rem;">
            <div class="bg-white rounded-4 shadow p-4 p-sm-5">

                <!--/* タイトル */-->
                <h1 class="text-center fw-bold text-dark mb-1" style="font-size: 1.5rem;">ログイン</h1>
                <p class="text-center text-secondary mb-4" style="font-size: 0.875rem;">
                    お気に入り登録・レビュー投稿を利用するにはログインしてください
                </p>

                <!--/* エラーメッセージ */-->
                <div th:if="${param.error}" class="alert alert-danger py-2 mb-3" style="font-size: 0.875rem;">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    メールアドレスまたはパスワードが正しくありません。
                </div>

                <!--/* ログインフォーム */-->
                <form th:action="@{/authentication}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!--/* returnUrlをhiddenで引き継ぐ */-->
                    <input type="hidden" name="returnUrl" th:value="${param.returnUrl}">

                    <!--/* ユーザー名 */-->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold" style="font-size: 0.875rem;">ユーザー名</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"
                                style="color: #9ca3af; border-color: #e5e7eb;">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" id="username" name="username" class="form-control border-start-0 ps-0"
                                style="border-color: #e5e7eb; background: #f9fafb;" placeholder="ユーザー名を入力"
                                autocomplete="username" required>
                        </div>
                    </div>

                    <!--/* パスワード */-->
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold" style="font-size: 0.875rem;">パスワード</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"
                                style="color: #9ca3af; border-color: #e5e7eb;">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" id="password" name="password"
                                class="form-control border-start-0 ps-0"
                                style="border-color: #e5e7eb; background: #f9fafb;" placeholder="パスワードを入力"
                                autocomplete="current-password" required>
                        </div>
                    </div>

                    <!--/* ログインボタン */-->
                    <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 mb-4"
                        style="border-radius: 0.5rem; font-size: 1rem;">
                        ログイン
                    </button>

                </form>

                <!--/* 新規登録へ */-->
                <p class="text-center text-secondary mb-2" style="font-size: 0.875rem;">アカウントをお持ちでない方は</p>
                <a th:href="@{/register}" class="btn btn-outline-secondary btn-register w-100 fw-bold py-2"
                    style="border-radius: 0.5rem; font-size: 0.95rem; border-color: #d1d5db; color: #374151;">
                    新規登録
                </a>

                <!--/* デモ用アカウント */-->
                <!--/*
                <div class="mt-4 p-3 rounded-3" style="background: #f8fafc; border: 1px solid #e2e8f0;">
                    <p class="fw-semibold mb-1 text-dark" style="font-size: 0.8rem;">デモ用アカウント：</p>
                    <p class="mb-0 text-secondary" style="font-size: 0.8rem;">ユーザー名: demouser</p>
                    <p class="mb-0 text-secondary" style="font-size: 0.8rem;">パスワード: Demo@2026</p>
                </div>
                */-->
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
