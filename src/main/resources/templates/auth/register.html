<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - 長堀橋さんぽ</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .btn-login-link:hover {
            background-color: #f8fafc;
            border-color: #d1d5db;
            color: #374151;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);">

    <!-- シンプルヘッダー -->
    <header class="bg-white border-bottom py-3">
        <div class="container">
            <a th:href="@{/}" class="text-decoration-none fw-bold d-inline-flex align-items-center"
                style="font-family: 'Nunito', sans-serif; color: #1e293b; font-size: 1.1rem;">
                <i class="bi bi-geo-alt me-1" style="color: #2563eb;"></i>長堀橋さんぽ
            </a>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="w-100" style="max-width: 480px; padding: 0 1rem;">
            <div class="bg-white rounded-4 shadow p-4 p-sm-5">

                <!-- タイトル -->
                <h1 class="text-center fw-bold text-dark mb-1" style="font-size: 1.5rem;">新規登録</h1>
                <p class="text-center text-secondary mb-4" style="font-size: 0.875rem;">
                    お気に入り登録・レビュー投稿を利用するにはユーザー登録が必要です
                </p>

                <!-- エラーメッセージ -->
                <div th:if="${errorMessage}" class="alert alert-danger py-2 mb-3" style="font-size: 0.875rem;">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <!-- 登録フォーム -->
                <form th:action="@{/register}" method="post" th:object="${userRegisterForm}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- ユーザー名 -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold" style="font-size: 0.875rem;">
                            ユーザー名 <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"
                                style="color: #9ca3af; border-color: #e5e7eb;">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" id="username" th:field="*{username}"
                                class="form-control border-start-0 ps-0"
                                style="border-color: #e5e7eb; background: #f9fafb;"
                                placeholder="ログインに使うIDを入力" autocomplete="username" required>
                        </div>
                        <div th:if="${#fields.hasErrors('username')}" class="text-danger mt-1"
                            style="font-size: 0.8rem;" th:errors="*{username}"></div>
                    </div>

                    <!-- 表示名 -->
                    <div class="mb-3">
                        <label for="displayName" class="form-label fw-semibold" style="font-size: 0.875rem;">
                            表示名 <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"
                                style="color: #9ca3af; border-color: #e5e7eb;">
                                <i class="bi bi-card-text"></i>
                            </span>
                            <input type="text" id="displayName" th:field="*{displayName}"
                                class="form-control border-start-0 ps-0"
                                style="border-color: #e5e7eb; background: #f9fafb;"
                                placeholder="画面上に表示される名前" autocomplete="nickname" required>
                        </div>
                        <div th:if="${#fields.hasErrors('displayName')}" class="text-danger mt-1"
                            style="font-size: 0.8rem;" th:errors="*{displayName}"></div>
                    </div>

                    <!-- メールアドレス -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold" style="font-size: 0.875rem;">
                            メールアドレス <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"
                                style="color: #9ca3af; border-color: #e5e7eb;">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" id="email" th:field="*{email}"
                                class="form-control border-start-0 ps-0"
                                style="border-color: #e5e7eb; background: #f9fafb;"
                                placeholder="example@email.com" autocomplete="email" required>
                        </div>
                        <div th:if="${#fields.hasErrors('email')}" class="text-danger mt-1"
                            style="font-size: 0.8rem;" th:errors="*{email}"></div>
                    </div>

                    <!-- パスワード -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold" style="font-size: 0.875rem;">
                            パスワード <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"
                                style="color: #9ca3af; border-color: #e5e7eb;">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" id="password" th:field="*{password}"
                                class="form-control border-start-0 ps-0"
                                style="border-color: #e5e7eb; background: #f9fafb;"
                                placeholder="パスワードを入力" autocomplete="new-password" required>
                        </div>
                        <div th:if="${#fields.hasErrors('password')}" class="text-danger mt-1"
                            style="font-size: 0.8rem;" th:errors="*{password}"></div>
                    </div>

                    <!-- パスワード確認 -->
                    <div class="mb-4">
                        <label for="passwordConfirm" class="form-label fw-semibold" style="font-size: 0.875rem;">
                            パスワード（確認） <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"
                                style="color: #9ca3af; border-color: #e5e7eb;">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}"
                                class="form-control border-start-0 ps-0"
                                style="border-color: #e5e7eb; background: #f9fafb;"
                                placeholder="もう一度入力してください" autocomplete="new-password" required>
                        </div>
                        <div th:if="${#fields.hasErrors('passwordConfirm')}" class="text-danger mt-1"
                            style="font-size: 0.8rem;" th:errors="*{passwordConfirm}"></div>
                    </div>

                    <!-- 登録ボタン -->
                    <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 mb-4"
                        style="border-radius: 0.5rem; font-size: 1rem;">
                        登録する
                    </button>
                </form>

                <!-- ログインへ -->
                <p class="text-center mb-0" style="font-size: 0.875rem; color: #64748b;">
                    既にアカウントをお持ちの方は
                    <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">ログイン</a>
                </p>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
