<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録完了 - 長堀橋さんぽ</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .btn-top:hover {
            background-color: #f8fafc;
            border-color: #d1d5db;
            color: #374151;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);">

    <!--/* シンプルヘッダー */-->
    <header class="bg-white border-bottom py-3">
        <div class="container">
            <a th:href="@{/}" class="text-decoration-none fw-bold d-inline-flex align-items-center"
                style="font-family: 'Nunito', sans-serif; color: #1e293b; font-size: 1.1rem;">
                <i class="bi bi-geo-alt me-1" style="color: #2563eb;"></i>長堀橋さんぽ
            </a>
        </div>
    </header>

    <!--/* メインコンテンツ */-->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="w-100" style="max-width: 440px; padding: 0 1rem;">
            <div class="bg-white rounded-4 shadow p-4 p-sm-5 text-center">

                <!--/* チェックアイコン */-->
                <div class="mb-4">
                    <i class="bi bi-check-circle" style="font-size: 4rem; color: #16a34a;"></i>
                </div>

                <!--/* タイトル */-->
                <h1 class="fw-bold text-dark mb-3" style="font-size: 1.5rem;">登録完了</h1>

                <!--/* メッセージ */-->
                <p class="text-secondary mb-4" style="font-size: 0.9rem; line-height: 1.8;">
                    ユーザー登録が完了しました。<br>
                    ログインしてお気に入り機能をご利用ください。
                </p>

                <!--/* ログイン画面へ */-->
                <a th:href="@{/login}" class="btn btn-primary w-100 fw-semibold py-2 mb-3"
                    style="border-radius: 0.5rem; font-size: 1rem;">
                    ログイン画面へ
                </a>

                <!--/* トップページへ */-->
                <a th:href="@{/}" class="btn btn-outline-secondary btn-top w-100 fw-semibold py-2"
                    style="border-radius: 0.5rem; font-size: 1rem; border-color: #d1d5db; color: #374151;">
                    トップページへ
                </a>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
