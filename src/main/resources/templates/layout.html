<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title th:text="${title} + ' - 長堀橋さんぽ'">長堀橋さんぽ</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* メガメニュー */
        @media (min-width: 992px) {

            /*
             * Bootstrap の navbar は align-items: center のため
             * 内部の cat-item がナビバーより短くなり下端に隙間が生じる。
             * stretch を連鎖させて cat-item をナビバー全高に引き伸ばす。
             */
            nav.navbar {
                position: relative;
                align-items: stretch;
            }

            nav.navbar>.container,
            nav.navbar>.container-fluid {
                align-items: stretch;
            }

            nav.navbar .navbar-collapse {
                align-items: stretch;
            }

            nav.navbar .navbar-nav {
                align-items: stretch;
            }

            /* ブランド・アカウントボタンは中央揃えを維持 */
            nav.navbar .navbar-brand,
            nav.navbar .navbar-toggler,
            nav.navbar .d-flex.align-items-center {
                align-self: center;
            }

            /* cat-item はナビバー全高を占め、テキストは上下中央 */
            .cat-item {
                display: flex;
                align-items: center;
            }

            /* メガパネル */
            .mega-panel {
                display: none;
                position: absolute;
                left: 0;
                right: 0;
                top: 100%;
                background: #fff;
                border-bottom: 1px solid #dee2e6;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
                padding: 1rem 0;
                z-index: 1050;
            }

            /* ナビバー下端との隙間を透明エリアで埋める */
            .mega-panel::before {
                content: '';
                position: absolute;
                top: -1rem;
                /* 隙間より大きければ十分 */
                left: 0;
                right: 0;
                height: 1rem;
            }

            .cat-item.cat-open .mega-panel {
                display: block;
            }

            .mega-item {
                display: inline-block;
                width: 16.66%;
                padding: 0.35rem 0.75rem;
                color: #374151;
                text-decoration: none;
                font-size: 0.875rem;
                border-radius: 0.375rem;
            }

            .mega-item:hover {
                background: #f3f4f6;
                color: #2563eb;
            }
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
            <div class="container">

                <a class="navbar-brand fw-bold" th:href="@{/}"
                    style="font-family: 'Nunito', sans-serif; color: #8a8c99;">長堀橋さんぽ</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="メニューを開く">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">

                    <!-- カテゴリナビ（センタリング） -->
                    <ul class="navbar-nav mx-auto" id="categoryNav">
                        <li class="nav-item cat-item" th:each="cat : ${navCategories}">
                            <a class="nav-link fw-medium" th:href="@{/spot/category/{id}(id=${cat.id})}"
                                th:text="${cat.name}">カテゴリ</a>

                            <!-- メガメニューパネル -->
                            <div class="mega-panel" th:if="${navSubCategoryMap[cat.id] != null}">
                                <div class="container">
                                    <a th:each="sub : ${navSubCategoryMap[cat.id]}" class="mega-item"
                                        th:href="@{/spot/subcategory/{id}(id=${sub.id})}"
                                        th:text="${sub.name}">サブカテゴリ</a>
                                </div>
                            </div>
                        </li>
                    </ul>

                    <!-- アカウントエリア -->
                    <div class="d-flex align-items-center gap-2">

                        <!-- 未ログイン -->
                        <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                            <a th:href="@{/register}" class="btn btn-sm btn-outline-secondary">会員登録</a>
                            <a th:href="@{/login}" class="btn btn-sm btn-primary">ログイン</a>
                        </div>

                        <!-- ログイン済み -->
                        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                            <span class="small fw-semibold text-secondary"
                                th:text="${account?.displayName}">ユーザー名</span>
                            <a th:href="@{/mypage}" class="btn btn-sm btn-outline-primary">マイページ</a>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm btn-outline-danger">ログアウト</button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!--/* フラッシュメッセージ (共通) */-->
    <div th:if="${message}" class="container pt-3">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <div th:if="${errorMessage}" class="container pt-3">
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div th:replace="${content}" class="flex-grow-1"><!-- ページコンテンツ --></div>

    <footer class="py-3 mt-auto bg-body-tertiary border-top">
        <div class="container text-center">
            <p class="mb-0 text-muted small">
                &copy; 2026
                <a href="https://github.com/rk-aiz/NagahoribashiWalk">CIC 304教室 Cチーム</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            var nav = document.getElementById('categoryNav');
            if (!nav) return;
            var items = nav.querySelectorAll('.cat-item');

            items.forEach(function (item) {
                item.addEventListener('mouseenter', function () {
                    items.forEach(function (i) { i.classList.remove('cat-open'); });
                    item.classList.add('cat-open');
                });
            });

            nav.addEventListener('mouseleave', function () {
                items.forEach(function (i) { i.classList.remove('cat-open'); });
            });
        })();
    </script>
</body>

</html>
