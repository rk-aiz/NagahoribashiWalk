<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクセス権限エラー - 長堀橋さんぽ</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100 align-items-center justify-content-center"
    style="background-color: #f8fafc;">

    <div class="text-center" style="max-width: 480px; padding: 0 1.5rem;">

        <!-- アイコン -->
        <div class="mb-4">
            <i class="bi bi-shield-lock" style="font-size: 3.5rem; color: #94a3b8;"></i>
        </div>

        <!-- メッセージ -->
        <h1 class="fw-bold mb-2" style="font-size: 1.5rem; color: #1e293b;">アクセスできません</h1>
        <p class="text-secondary mb-1" style="font-size: 0.95rem;">
            管理者アカウントでは、一般ユーザー向けページにアクセスできません。
        </p>
        <p class="text-secondary mb-5" style="font-size: 0.875rem;">
            一般ユーザーとして利用する場合は、一度ログアウトしてください。
        </p>

        <!-- ボタン -->
        <div class="d-flex flex-column gap-3">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2"
                    style="border-radius: 0.5rem;">
                    <i class="bi bi-box-arrow-right me-1"></i>ログアウト
                </button>
            </form>
            <a th:href="@{/admin}" class="btn btn-outline-secondary w-100 py-2"
                style="border-radius: 0.5rem; border-color: #d1d5db; color: #374151;">
                <i class="bi bi-speedometer2 me-1"></i>管理者ページへ戻る
            </a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
