<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="layout(title, subtitle, content)" xml:lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title th:text="${title} + ' - 長堀橋さんぽ 管理画面'">長堀橋さんぽ 管理画面</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f3f4f6;
        }

        .admin-header {
            background: linear-gradient(135deg, #7c3aed 0%, #9333ea 100%);
        }

        .admin-brand-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            font-family: 'Nunito', sans-serif;
            line-height: 1.2;
        }

        .admin-brand-subtitle {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.2;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="admin-header py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- ブランド -->
            <a th:href="@{/admin}" class="text-decoration-none d-flex align-items-center gap-2">
                <i class="bi bi-geo-alt-fill text-white" style="font-size: 1.6rem;"></i>
                <div>
                    <div class="admin-brand-title">長堀橋さんぽ 管理画面</div>
                    <div class="admin-brand-subtitle" th:text="${subtitle}">管理画面</div>
                </div>
            </a>

            <!-- ナビ -->
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/admin}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-speedometer2 me-1"></i>ダッシュボード
                </a>
                <a th:href="@{/admin/spot/list}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-list-ul me-1"></i>スポット一覧
                </a>
                <a th:href="@{/admin/user/list}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-people me-1"></i>ユーザー管理
                </a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-sm btn-light ms-1">
                        <i class="bi bi-box-arrow-right me-1"></i>ログアウト
                    </button>
                </form>
            </div>
        </div>
    </header>

    <!-- フラッシュメッセージ（共通） -->
    <div th:if="${message}" class="container pt-3">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-1"></i>
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <div th:if="${errorMessage}" class="container pt-3">
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <main class="flex-grow-1 py-4">
        <div th:replace="${content}"><!-- ページコンテンツ --></div>
    </main>

    <footer style="background-color: #1e293b; color: #94a3b8;" class="py-3">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 CIC 304教室 Cチーム長堀橋さんぽプロジェクト. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
