<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!--
    スライディングウィンドウ式ページネーション フラグメント
    パラメータ:
      spotPages  : Page オブジェクト
      category   : カテゴリ識別子（URL組み立て用）
      navClass   : <nav> に追加するクラス（例: "mb-3", "mt-4"）
-->
    <nav th:fragment="pager(spotPages, categoryId, pagerBaseUrl, navClass)" th:if="${spotPages.totalPages > 1}"
        aria-label="ページネーション" class="d-flex justify-content-center" th:classappend="${navClass}">

        <ul class="pagination pager-minimal mb-0">

            <!--/* 前へ */-->
            <li class="page-item" th:classappend="${spotPages.first} ? 'disabled'">
                <a class="page-link" th:href="@{${pagerBaseUrl + categoryId}(page=${spotPages.number - 1})}">
                    <i class="bi bi-chevron-left"></i> 前へ
                </a>
            </li>

            <!--/* 1ページ目（常に表示） */-->
            <li class="page-item" th:classappend="${spotPages.number == 0} ? 'active'">
                <a class="page-link" th:href="@{${pagerBaseUrl + categoryId}(page=0)}">1</a>
            </li>

            <!--/* 左省略記号 */-->
            <li th:if="${spotPages.totalPages > 5 and spotPages.number > 3}" class="page-item disabled">
                <span class="page-link pager-ellipsis">…</span>
            </li>

            <!--/* 中間ページ（current ± 2、先頭/末尾を除く） */-->
            <th:block th:if="${spotPages.totalPages >= 3}">
                <th:block th:each="i : ${#numbers.sequence(1, spotPages.totalPages - 2)}"
                    th:if="${spotPages.totalPages <= 5 or (i >= spotPages.number - 2 and i <= spotPages.number + 2)}">
                    <li class="page-item" th:classappend="${i == spotPages.number} ? 'active'">
                        <a class="page-link" th:href="@{${pagerBaseUrl + categoryId}(page=${i})}"
                            th:text="${i + 1}">2</a>
                    </li>
                </th:block>
            </th:block>

            <!--/* 右省略記号 */-->
            <li th:if="${spotPages.totalPages > 5 and spotPages.number < spotPages.totalPages - 4}"
                class="page-item disabled">
                <span class="page-link pager-ellipsis">…</span>
            </li>

            <!--/* 最終ページ（常に表示） */-->
            <li class="page-item" th:classappend="${spotPages.number == spotPages.totalPages - 1} ? 'active'">
                <a class="page-link" th:href="@{${pagerBaseUrl + categoryId}(page=${spotPages.totalPages - 1})}"
                    th:text="${spotPages.totalPages}">N</a>
            </li>

            <!--/* 次へ */-->
            <li class="page-item" th:classappend="${spotPages.last} ? 'disabled'">
                <a class="page-link" th:href="@{${pagerBaseUrl + categoryId}(page=${spotPages.number + 1})}">
                    次へ <i class="bi bi-chevron-right"></i>
                </a>
            </li>

        </ul>
    </nav>

    <!--/* 管理画面など、シンプルな baseUrl + keyword + sort + page 構成用 */-->
    <nav th:fragment="pagerSimple(spotPages, baseUrl, keyword, sort, navClass)" th:if="${spotPages.totalPages > 1}"
        aria-label="ページネーション" class="d-flex justify-content-center" th:classappend="${navClass}">

        <ul class="pagination pager-minimal mb-0">

            <!--/* 前へ */-->
            <li class="page-item" th:classappend="${spotPages.first} ? 'disabled'">
                <a class="page-link"
                    th:href="@{${baseUrl}(keyword=${#strings.isEmpty(keyword) ? null : keyword}, sort=${sort}, page=${spotPages.number - 1})}">
                    <i class="bi bi-chevron-left"></i> 前へ
                </a>
            </li>

            <!--/* 1ページ目（常に表示） */-->
            <li class="page-item" th:classappend="${spotPages.number == 0} ? 'active'">
                <a class="page-link"
                    th:href="@{${baseUrl}(keyword=${#strings.isEmpty(keyword) ? null : keyword}, sort=${sort}, page=0)}">1</a>
            </li>

            <!--/* 左省略記号 */-->
            <li th:if="${spotPages.totalPages > 5 and spotPages.number > 3}" class="page-item disabled">
                <span class="page-link pager-ellipsis">…</span>
            </li>

            <!--/* 中間ページ（current ± 2、先頭/末尾を除く） */-->
            <th:block th:if="${spotPages.totalPages >= 3}">
                <th:block th:each="i : ${#numbers.sequence(1, spotPages.totalPages - 2)}"
                    th:if="${spotPages.totalPages <= 5 or (i >= spotPages.number - 2 and i <= spotPages.number + 2)}">
                    <li class="page-item" th:classappend="${i == spotPages.number} ? 'active'">
                        <a class="page-link"
                            th:href="@{${baseUrl}(keyword=${#strings.isEmpty(keyword) ? null : keyword}, sort=${sort}, page=${i})}"
                            th:text="${i + 1}">2</a>
                    </li>
                </th:block>
            </th:block>

            <!--/* 右省略記号 */-->
            <li th:if="${spotPages.totalPages > 5 and spotPages.number < spotPages.totalPages - 4}"
                class="page-item disabled">
                <span class="page-link pager-ellipsis">…</span>
            </li>

            <!--/* 最終ページ（常に表示） */-->
            <li class="page-item" th:classappend="${spotPages.number == spotPages.totalPages - 1} ? 'active'">
                <a class="page-link"
                    th:href="@{${baseUrl}(keyword=${#strings.isEmpty(keyword) ? null : keyword}, sort=${sort}, page=${spotPages.totalPages - 1})}"
                    th:text="${spotPages.totalPages}">N</a>
            </li>

            <!--/* 次へ */-->
            <li class="page-item" th:classappend="${spotPages.last} ? 'disabled'">
                <a class="page-link"
                    th:href="@{${baseUrl}(keyword=${#strings.isEmpty(keyword) ? null : keyword}, sort=${sort}, page=${spotPages.number + 1})}">
                    次へ <i class="bi bi-chevron-right"></i>
                </a>
            </li>

        </ul>
    </nav>

    <!--/* 検索ページ用 */-->
    <nav th:fragment="pagerSearch(spotPages, keyword, navClass)" th:if="${spotPages.totalPages > 1}"
        aria-label="ページネーション" class="d-flex justify-content-center" th:classappend="${navClass}">

        <ul class="pagination pagerSearch-minimal mb-0">

            <!--/* 前へ */-->
            <li class="page-item" th:classappend="${spotPages.first} ? 'disabled'">
                <a class="page-link"
                    th:href="${spotPages.first} ? '#' : @{/spot/search(q=${keyword}, page=${spotPages.number - 1})}">
                    前へ
                </a>
            </li>

            <!--/* ページ番号（ここを丸ごと置き換え） */-->
            <th:block th:if="${spotPages.totalPages <= 5}">
                <li class="page-item" th:each="i : ${#numbers.sequence(0, spotPages.totalPages - 1)}"
                    th:classappend="${i == spotPages.number} ? 'active'">
                    <a class="page-link" th:href="@{/spot/search(q=${keyword}, page=${i})}" th:text="${i + 1}">1</a>
                </li>
            </th:block>

            <th:block th:if="${spotPages.totalPages > 5}">

                <!--/* 1ページ目 */-->
                <li class="page-item" th:classappend="${spotPages.number == 0} ? 'active'">
                    <a class="page-link" th:href="@{/spot/search(q=${keyword}, page=0)}">1</a>
                </li>

                <!--/* 中間 */-->
                <th:block th:each="i : ${#numbers.sequence(1, spotPages.totalPages - 2)}"
                    th:if="${i >= spotPages.number - 2 and i <= spotPages.number + 2}">
                    <li class="page-item" th:classappend="${i == spotPages.number} ? 'active'">
                        <a class="page-link" th:href="@{/spot/search(q=${keyword}, page=${i})}" th:text="${i + 1}">2</a>
                    </li>
                </th:block>

                <!--/* 最終ページ */-->
                <li class="page-item" th:classappend="${spotPages.number == spotPages.totalPages - 1} ? 'active'">
                    <a class="page-link" th:href="@{/spot/search(q=${keyword}, page=${spotPages.totalPages - 1})}"
                        th:text="${spotPages.totalPages}">N</a>
                </li>

            </th:block>

            <!--/* 次へ */-->
            <li class="page-item" th:classappend="${spotPages.last} ? 'disabled'">
                <a class="page-link"
                    th:href="${spotPages.last} ? '#' : @{/spot/search(q=${keyword}, page=${spotPages.number + 1})}">
                    次へ
                </a>
            </li>
        </ul>
    </nav>

</body>

</html>
