<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>長堀橋さんぽ</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
	 
	<div class="bg-white border-bottom py-3">
	    <div class="container">
	        <a href="javascript:history.back()"
	            class="text-decoration-none text-secondary small d-inline-flex align-items-center mb-2">
	            <i class="bi bi-arrow-left me-1"></i>戻る
	        </a>
	        <div class="d-flex align-items-baseline gap-3">

				<p>
					「<span th:text="${keyword}">キーワード</span>」の検索結果
				</p>
				<p>
					<span th:text="${page.totalElements}"></span>件のスポットが見つかりました
				</p>
	        </div>
	    </div>
	</div>

	<!-- 上部ページネーション -->
	<div th:replace="~{fragments/pagination :: pagerSearch(${page}, ${keyword}, 'mb-3')}"></div>

	<!-- スポットグリッド（2カラム） -->
	<div class="row row-cols-1 row-cols-sm-3 g-3">
	    <div class="col" th:each="spot : ${page}">
	        <th:block th:replace="~{fragments/spot-card :: card(${spot})}"></th:block>
	    </div>
	</div>

	<!-- スポット0件時のメッセージ -->
	<div th:if="${page.totalElements == 0}" class="text-center py-5 text-secondary">
	    <i class="bi bi-search" style="font-size: 2.5rem;"></i>
	    <p class="mt-3 mb-0">スポットが見つかりませんでした。</p>
	</div>

	<style>
	.card-img-top {
	    height: 200px;
	    object-fit: cover;
	}
	</style>
	
</body>

</html>
