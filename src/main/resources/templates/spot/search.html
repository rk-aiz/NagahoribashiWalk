<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>長堀橋さんぽ</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
	<p>
		「<span th:text="${keyword}">キーワード</span>」の検索結果
	</p>

	<p>
		<span th:text="${page.totalElements}"></span>件のスポットが見つかりました
	</p>
	<div class="row">

	    <div class="col-12 col-sm-6 col-md-4 mb-4"
	         th:each="spot : ${page.content}">

	        <a th:href="@{/spots/{id}(id=${spot.id})}"
	           class="text-decoration-none text-dark">

	            <div class="card h-100 shadow-sm">

	                <img th:src="${spot.photoUrl}" class="card-img-top">

	                <div class="card-body">
	                    <h5 class="card-title" th:text="${spot.spotName}"></h5>
	                    <span class="badge bg-primary">検索</span>
	                </div>

	            </div>

	        </a>

	    </div>

	</div>

	<style>
	.card-img-top {
	    height: 200px;
	    object-fit: cover;
	}
	</style>
	<div class="mt-4 text-center">
	    <a th:if="${page.hasPrevious()}"
	       th:href="@{/spot/search(q=${keyword}, page=${page.number - 1})}">
	       前へ
	    </a>

	    <a th:if="${page.hasNext()}"
	       th:href="@{/spot/search(q=${keyword}, page=${page.number + 1})}">
	       次へ
	    </a>
	</div>
</body>

</html>
