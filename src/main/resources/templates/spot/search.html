<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>長堀橋さんぽ</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<!-- ===================== -->
<!-- ヘッダー -->
<!-- ===================== -->
<div class="bg-white border-bottom shadow-sm py-3 mb-3">
    <div class="container">

        <!-- 戻る -->
        <a href="javascript:history.back()"
           class="text-decoration-none text-secondary small d-inline-flex align-items-center mb-2">
            ← 戻る
        </a>

        <!-- タイトル -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center">

            <h5 class="mb-1 fw-bold">
                「<span th:text="${keyword}">キーワード</span>」の検索結果
            </h5>

            <span class="text-muted small">
                <span th:text="${page.totalElements}"></span>件ヒット
            </span>

        </div>
    </div>
</div>

<!-- ===================== -->
<!-- ページネーション -->
<!-- ===================== -->
<div class="container">
    <div th:replace="~{fragments/pagination :: pagerSearch(${page}, ${keyword}, 'mb-4')}"></div>
</div>

<!-- ===================== -->
<!-- スポット一覧 -->
<!-- ===================== -->
<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">

        <div class="col" th:each="spot : ${page}">
            <div class="card h-100 shadow-sm border-0">

                <th:block th:replace="~{fragments/spot-card :: card(${spot})}"></th:block>

            </div>
        </div>

    </div>
</div>

<!-- ===================== -->
<!-- 0件メッセージ -->
<!-- ===================== -->
<div th:if="${page.totalElements == 0}" class="text-center py-5 text-secondary">
    <div class="mb-3" style="font-size: 2.5rem;">🔍</div>
    <h5 class="fw-bold">見つかりませんでした</h5>
    <p class="mb-0 small">検索キーワードを変えてみてください</p>
</div>

<!-- ===================== -->
<!-- スタイル -->
<!-- ===================== -->
<style>
.card-img-top {
    height: 200px;
    object-fit: cover;
    border-radius: 0.5rem 0.5rem 0 0;
}

.card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}
</style>

</body>

</html>
