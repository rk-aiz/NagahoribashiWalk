<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>長堀橋さんぽ</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
	<div class="container mt-4">

		<h1 class="mb-4">スポット一覧</h1>

		<!-- 🔍 検索フォーム -->
		<form th:action="@{/spots}" method="get" class="row g-2 mb-4">
			<div class="col-auto">
				<input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="キーワード検索">
			</div>
			<div class="col-auto">
				<button type="submit" class="btn btn-primary">
					検索
				</button>
			</div>
		</form>

		<!-- 📋 一覧 -->
		<table class="table table-striped">
			<thead>
				<tr>
					<th>ID</th>
					<th>スポット名</th>
					<th>住所</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="spot : ${page.content}">
					<td th:text="${spot.id}"></td>
					<td th:text="${spot.spotName}"></td>
					<td th:text="${spot.address}"></td>
				</tr>
			</tbody>
		</table>

		<!-- 📄 ページング -->
		<nav>
			<ul class="pagination">

				<!-- 前へ -->
				<li class="page-item" th:classappend="${page.hasPrevious()} ? '' : 'disabled'">
					<a class="page-link" th:href="@{/spots(page=${page.number - 1}, keyword=${keyword})}">
						前へ
					</a>
				</li>

				<!-- ページ番号 -->
				<li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
					th:classappend="${i == page.number} ? 'active'">
					<a class="page-link" th:href="@{/spots(page=${i}, keyword=${keyword})}" th:text="${i + 1}">
					</a>
				</li>

				<!-- 次へ -->
				<li class="page-item" th:classappend="${page.hasNext()} ? '' : 'disabled'">
					<a class="page-link" th:href="@{/spots(page=${page.number + 1}, keyword=${keyword})}">
						次へ
					</a>
				</li>

			</ul>
		</nav>

	</div>
</body>

</html>
