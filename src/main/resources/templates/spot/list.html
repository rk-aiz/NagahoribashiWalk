<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長堀橋さんぽ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
	
	<section class="container my-5">
		<h2 class="mb-4 text-center">スポット一覧</h2>

		<div class="row g-4">
			<div class="col-md-4" th:each="spot : ${spots}">
				<div class="card h-100">
					
					<!--画像表示-->
					<img th:src="@{/uploads/{url}(url=${spot.photoUrl})}"
						class="card-img-top" th:alt="${spot.spotName}"
						style="height: 200px; object-fit: cover;">
						
					<div class="card-body">

						<!--スポット名-->
						<h5 class="card-title" th:text="${spot.spotName}"></h5>

						<!--カテゴリー/サブカテゴリー表示-->
						<p class="text-muted mb-1">
							<span th:text="${spot.categoryName}"></span>
							/
							<span th:text="${spot.subCategoryName}"></span>
						</p>
						<a th:href="@{/spot/{id}(id=${spot.id})}" class="btn btn-primary btn-sm">詳しく見る</a>
					</div>
				</div>
			</div>
		</div>
	</section>
	
</body>

</html>
