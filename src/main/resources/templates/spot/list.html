<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/default :: layout('スポット一覧', ~{::main}, ~{:: headStyles})}"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>スポット一覧</title>
    <th:block th:fragment="headStyles">
        <th:block th:replace="~{fragments/spot-card :: styles}"></th:block>
        <style>
            /* ===== シンプルページネーション ===== */
            .pager-minimal {
                gap: 0.3rem;
            }

            .pager-minimal .page-item .page-link {
                border: none;
                background: transparent;
                color: #64748b;
                font-size: 0.875rem;
                border-radius: 0.4rem;
                padding: 0.35rem 0.65rem;
                line-height: 1.4;
                box-shadow: none;
                transition: background-color 0.15s, color 0.15s;
            }

            .pager-minimal .page-item .page-link:hover {
                background-color: #f1f5f9;
                color: #334155;
            }

            .pager-minimal .page-item.active .page-link {
                background-color: #dbeafe;
                color: #1d4ed8;
                font-weight: 600;
            }

            .pager-minimal .page-item.disabled .page-link {
                color: #cbd5e1;
                pointer-events: none;
            }

            .pager-minimal .pager-ellipsis {
                color: #94a3b8;
                cursor: default;
                padding: 0.35rem 0.4rem;
            }

            .pager-minimal.pager-sm .page-link {
                font-size: 0.8rem;
                padding: 0.25rem 0.55rem;
            }

            .sidebar-item-link:hover {
                background-color: #f8fafc;
                color: #374151 !important;
            }
        </style>
    </th:block>
</head>

<body>

    <main class="flex-grow-1" style="background-color: #f8fafc;">

        <!-- ページヘッダー -->
        <div class="bg-white border-bottom py-3">
            <div class="container">
                <a th:href="@{/}"
                    class="text-decoration-none text-secondary small d-inline-flex align-items-center mb-2">
                    <i class="bi bi-arrow-left me-1"></i>トップへ戻る
                </a>
                <h2 class="h3 mb-1 fw-bold text-dark" th:text="${categoryName}">
                    カテゴリ名
                </h2>
                <span class="text-secondary small" th:text="${spotPages.totalElements + '件のスポット'}">0件のスポット</span>
            </div>
        </div>

        <div class="container py-4">
            <div class="row g-4 align-items-start">

                <!-- ===== 左サイドバー ===== -->
                <aside class="col-lg-3 col-md-4">
                    <div class="bg-white rounded-3 border p-3">
                        <p class="fw-bold text-dark mb-3" style="font-size: 0.95rem;">絞り込み</p>

                        <!-- カテゴリー -->
                        <p class="text-secondary mb-2 fw-semibold text-uppercase"
                            style="font-size: 0.75rem; letter-spacing: 0.07em;">カテゴリー</p>
                        <ul class="list-unstyled mb-4">
                            <li class="mb-1">
                                <a th:href="@{/spot/category/all}"
                                    class="d-block text-decoration-none rounded-2 px-3 py-2"
                                    th:classappend="${sidebar.selectedCategoryId == null} ? 'bg-primary bg-opacity-10 text-primary fw-semibold' : 'text-secondary sidebar-item-link'"
                                    style="font-size: 0.9rem;">すべて</a>
                            </li>
                            <li th:each="cat : ${sidebar.categories}" class="mb-1">
                                <a th:href="@{/spot/category/{id}(id=${cat.id})}" th:text="${cat.name}"
                                    class="d-block text-decoration-none rounded-2 px-3 py-2"
                                    th:classappend="${cat.id == sidebar.selectedCategoryId} ? 'bg-primary bg-opacity-10 text-primary fw-semibold' : 'text-secondary sidebar-item-link'"
                                    style="font-size: 0.9rem;">カテゴリ</a>
                            </li>
                        </ul>

                        <!-- サブカテゴリー（選択中カテゴリのみ表示） -->
                        <th:block th:each="cat : ${sidebar.categories}"
                            th:if="${cat.id == sidebar.selectedCategoryId and not #lists.isEmpty(cat.subCategories)}">
                            <p class="text-secondary mb-2 fw-semibold text-uppercase"
                                style="font-size: 0.75rem; letter-spacing: 0.07em;" th:text="${cat.name + 'の種類'}">種類</p>
                            <ul class="list-unstyled mb-0">
                                <li class="mb-1">
                                    <a th:href="@{/spot/category/{id}(id=${cat.id})}"
                                        class="d-block text-decoration-none rounded-2 px-3 py-2"
                                        th:classappend="${sidebar.selectedSubCategoryId == null} ? 'bg-primary bg-opacity-10 text-primary fw-semibold' : 'text-secondary sidebar-item-link'"
                                        style="font-size: 0.9rem;">すべて</a>
                                </li>
                                <li th:each="sub : ${cat.subCategories}" class="mb-1">
                                    <a th:href="@{/spot/subcategory/{id}(id=${sub.id})}" th:text="${sub.name}"
                                        class="d-block text-decoration-none rounded-2 px-3 py-2"
                                        th:classappend="${sub.id == sidebar.selectedSubCategoryId} ? 'bg-primary bg-opacity-10 text-primary fw-semibold' : 'text-secondary sidebar-item-link'"
                                        style="font-size: 0.9rem;">サブカテゴリ</a>
                                </li>
                            </ul>
                        </th:block>

                    </div>
                </aside>

                <!-- ===== メインコンテンツ ===== -->
                <div class="col-lg-9 col-md-8">

                    <!-- 上部ページネーション -->
                    <div th:replace="~{fragments/pagination :: pager(${spotPages}, ${categoryId}, 'mb-3')}"></div>

                    <!-- スポットグリッド（2カラム） -->
                    <div class="row row-cols-1 row-cols-sm-2 g-3">
                        <div class="col" th:each="spot : ${spotPages}">
                            <th:block th:replace="~{fragments/spot-card :: card(${spot})}"></th:block>
                        </div>
                    </div>

                    <!-- スポット0件時のメッセージ -->
                    <div th:if="${spotPages.totalElements == 0}" class="text-center py-5 text-secondary">
                        <i class="bi bi-search" style="font-size: 2.5rem;"></i>
                        <p class="mt-3 mb-0">スポットが見つかりませんでした。</p>
                    </div>

                    <!-- 下部ページネーション -->
                    <div th:replace="~{fragments/pagination :: pager(${spotPages}, ${categoryId}, 'mt-4')}"></div>

                </div>
            </div>
        </div>

    </main>

</body>

</html>
