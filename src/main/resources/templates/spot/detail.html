<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${spotDetail.spotName} + ' | スポット詳細'">スポット詳細</title>
	<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<style>
		.detail-card {
			background: #ffffff;
			border-radius: 1rem;
			box-shadow: 0 0.5rem 1.5rem rgba(15, 23, 42, 0.08);
			border: 1px solid #e2e8f0;
		}

		.section-card {
			background: #ffffff;
			border-radius: 1rem;
			border: 1px solid #e2e8f0;
			box-shadow: 0 0.25rem 1rem rgba(15, 23, 42, 0.05);
		}

		.info-label {
			font-size: 0.85rem;
			font-weight: 700;
			color: #475569;
			margin-bottom: 0.35rem;
		}

		.info-value {
			font-size: 0.95rem;
			color: #1e293b;
			margin-bottom: 0;
			word-break: break-word;
		}

		.section-title {
			font-size: 1.15rem;
			font-weight: 700;
			color: #1e293b;
			margin-bottom: 1rem;
		}

		.subtle-box {
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			border-radius: 0.75rem;
		}

		.photo-frame {
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			border-radius: 0.75rem;
			padding: 0.5rem;
			height: 100%;
		}

		.photo-frame img {
			width: 100%;
			height: 220px;
			object-fit: cover;
			border-radius: 0.5rem;
		}

		.review-card {
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			border-radius: 0.9rem;
		}

		.rating-badge {
			display: inline-flex;
			align-items: center;
			gap: 0.25rem;
			padding: 0.25rem 0.6rem;
			border-radius: 999px;
			background: #eff6ff;
			color: #1d4ed8;
			font-size: 0.85rem;
			font-weight: 700;
		}

		.link-button {
			text-decoration: none;
		}

		.favorite-form {
			display: inline-block;
		}

		.empty-box {
			background: #f8fafc;
			border: 1px dashed #cbd5e1;
			border-radius: 0.9rem;
			color: #64748b;
		}
	</style>
</head>

<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);">

	<header class="bg-white border-bottom py-3">
		<div class="container">
			<a th:href="@{/}" class="text-decoration-none fw-bold d-inline-flex align-items-center"
				style="font-family: 'Nunito', sans-serif; color: #1e293b; font-size: 1.1rem;">
				<i class="bi bi-geo-alt me-1" style="color: #2563eb;"></i>長堀橋さんぽ
			</a>
		</div>
	</header>

	<main class="flex-grow-1 py-4 py-md-5">
		<div class="container" style="max-width: 1100px;">

			<div class="detail-card p-4 p-md-5 mb-4">
				<div class="d-flex flex-column flex-lg-row justify-content-between align-items-start gap-3 mb-4">
					<div>
						<p class="text-secondary mb-2" style="font-size: 0.875rem;">スポット詳細</p>
						<h1 class="fw-bold mb-2" style="font-size: 2rem; color: #1e293b;"
							th:text="${spotDetail.spotName}">スポット名</h1>

						<div class="d-flex flex-wrap gap-2 mt-3">
							<span class="badge rounded-pill text-bg-light border"
								th:text="${spotDetail.categoryName}">カテゴリ名</span>
							<span class="badge rounded-pill text-bg-light border"
								th:text="${spotDetail.subCategoryName}">サブカテゴリ名</span>
							<span class="rating-badge">
								<i class="bi bi-star-fill"></i>
								<span th:text="${spotDetail.averageRating}">0.0</span>
							</span>
							<span class="badge rounded-pill text-bg-light border">
								レビュー
								<span class="ms-1" th:text="${spotDetail.reviewCount}">0</span>件
							</span>
						</div>
					</div>

					<div class="d-flex flex-wrap gap-2">
						<form th:action="@{/favorite/remove}" method="post" class="favorite-form">
							<input type="hidden" name="spotId" th:value="${spotId}">
							<button type="submit" class="btn btn-outline-secondary fw-semibold">
								<i class="bi bi-heartbreak me-1"></i>お気に入り解除
							</button>
						</form>

						<form th:action="@{/favorite/add}" method="post" class="favorite-form">
							<input type="hidden" name="spotId" th:value="${spotId}">
							<button type="submit" class="btn btn-primary fw-semibold">
								<i class="bi bi-heart-fill me-1"></i>お気に入り登録
							</button>
						</form>
					</div>
				</div>

				<div class="row g-4">
					<div class="col-lg-7">
						<div class="subtle-box p-4 h-100">

							<div th:if="${spotDetail.images != null and !#lists.isEmpty(spotDetail.images)}"
								class="mb-4">
								<div class="photo-frame">
									<img th:src="${'/uploads/' + spotDetail.images[0].photoUrl}" alt="スポット画像"
										style="width: 100%; height: 320px; object-fit: cover; border-radius: 0.5rem;">
								</div>
							</div>

							<p class="info-label">説明</p>
							<p class="info-value" th:text="${spotDetail.details}">詳細説明</p>
						</div>
					</div>

					<div class="col-lg-5">
						<div class="subtle-box p-4 h-100">
							<div class="mb-3">
								<p class="info-label">営業時間</p>
								<p class="info-value" th:text="${spotDetail.businessHours}">営業時間</p>
							</div>
							<div class="mb-3">
								<p class="info-label">予算</p>
								<p class="info-value" th:text="${spotDetail.estimatedBudget}">予算</p>
							</div>
							<div class="mb-3">
								<p class="info-label">住所</p>
								<p class="info-value" th:text="${spotDetail.address}">住所</p>
							</div>
							<div class="d-flex flex-column gap-2">
								<a th:if="${spotDetail.gmapUrl != null}" th:href="${spotDetail.gmapUrl}" target="_blank"
									class="btn btn-outline-primary fw-semibold link-button">
									<i class="bi bi-map me-1"></i>Google Mapを見る
								</a>
								<a th:if="${spotDetail.websiteUrl != null}" th:href="${spotDetail.websiteUrl}"
									target="_blank" class="btn btn-outline-secondary fw-semibold link-button">
									<i class="bi bi-globe2 me-1"></i>公式サイトを見る
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="section-card p-4 p-md-5 mb-4">
				<h2 class="section-title">
					<i class="bi bi-images me-2 text-primary"></i>画像一覧
				</h2>

				<div th:if="${spotDetail.images != null and spotDetail.images.size() > 1}" class="row g-3">
					<div th:each="image, stat : ${spotDetail.images}" th:if="${stat.index > 0}"
						class="col-12 col-sm-6 col-lg-4">
						<div class="photo-frame">
							<img th:src="${'/uploads/' + image.photoUrl}" alt="スポット画像">
						</div>
					</div>
				</div>

				<div th:if="${spotDetail.images == null or #lists.isEmpty(spotDetail.images) or spotDetail.images.size() == 1}"
					class="empty-box p-4 text-center">
					<i class="bi bi-image fs-3 d-block mb-2"></i>
					画像はありません。
				</div>



				<div class="section-card p-4 p-md-5 mb-4">
					<h2 class="section-title">
						<i class="bi bi-pencil-square me-2 text-primary"></i>レビュー投稿
					</h2>

					<div th:if="${session.user != null}" class="subtle-box p-4">
						<h5 class="fw-bold mb-3" style="color: #1e293b;">レビューを投稿する</h5>

						<form th:action="@{/spots/{id}/reviews(id=${spotDetail.id})}" method="post">
							<div class="mb-3">
								<label class="form-label fw-semibold" style="font-size: 0.875rem;">評価</label>
								<select name="rating" class="form-select"
									style="border-color: #e5e7eb; background: #f9fafb;">
									<option value="5">★★★★★</option>
									<option value="4">★★★★☆</option>
									<option value="3">★★★☆☆</option>
									<option value="2">★★☆☆☆</option>
									<option value="1">★☆☆☆☆</option>
								</select>
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold" style="font-size: 0.875rem;">コメント</label>
								<textarea name="comment" class="form-control" rows="4"
									style="border-color: #e5e7eb; background: #f9fafb;"
									placeholder="レビューを入力してください"></textarea>
							</div>

							<button class="btn btn-primary fw-semibold px-4" type="submit">
								<i class="bi bi-send me-1"></i>投稿する
							</button>
						</form>
					</div>

					<div th:unless="${session.user != null}" class="alert alert-info mb-0">
						レビューを投稿するには<a th:href="@{/login}" class="fw-semibold ms-1">ログイン</a>してください
					</div>
				</div>

				<div class="section-card p-4 p-md-5">
					<h2 class="section-title">
						<i class="bi bi-chat-left-text me-2 text-primary"></i>レビュー一覧
					</h2>

					<div th:if="${spotDetail.reviews != null and !#lists.isEmpty(spotDetail.reviews)}"
						class="d-grid gap-3">
						<div th:each="review : ${spotDetail.reviews}" class="review-card p-4">
							<div
								class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
								<div class="d-flex align-items-center gap-2">
									<div class="rounded-circle d-flex align-items-center justify-content-center"
										style="width: 42px; height: 42px; background: #dbeafe; color: #2563eb;">
										<i class="bi bi-person-fill"></i>
									</div>
									<div>
										<p class="mb-0 fw-bold" style="color: #1e293b;"
											th:text="${review.reviewerName}">投稿者名</p>
										<p class="mb-0 text-secondary" style="font-size: 0.85rem;">
											<span
												th:text="${#temporals.format(review.reviewDate, 'yyyy/MM/dd HH:mm')}">2026/04/02
												10:46</span>
										</p>
									</div>
								</div>

								<div class="rating-badge">
									<i class="bi bi-star-fill"></i>
									<span th:text="${review.rating}">5</span>
								</div>
							</div>

							<p class="mb-0" style="color: #334155; line-height: 1.8;" th:text="${review.comment}">
								レビュー本文
							</p>
						</div>
					</div>

					<div th:if="${spotDetail.reviews == null or #lists.isEmpty(spotDetail.reviews)}"
						class="empty-box p-4 text-center">
						<i class="bi bi-chat-square-text fs-3 d-block mb-2"></i>
						レビューはありません。
					</div>
				</div>

			</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
