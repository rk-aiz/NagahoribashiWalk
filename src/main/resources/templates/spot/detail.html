<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/default :: layout(${spotDetail.spotName}, ~{::main}, ~{::style})}"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<title>スポット詳細</title>
	<style>
		.detail-card {
			background: #ffffff;
			border-radius: 1rem;
			box-shadow: 0 0.5rem 1.5rem rgba(15, 23, 42, 0.08);
			border: 1px solid #e2e8f0;
		}

		.section-card {
			background: #ffffff;
			border-radius: 1rem;
			border: 1px solid #e2e8f0;
			box-shadow: 0 0.25rem 1rem rgba(15, 23, 42, 0.05);
		}

		.info-label {
			font-size: 0.85rem;
			font-weight: 700;
			color: #475569;
			margin-bottom: 0.35rem;
		}

		.info-value {
			font-size: 0.95rem;
			color: #1e293b;
			margin-bottom: 0;
			word-break: break-word;
		}

		.section-title {
			font-size: 1.15rem;
			font-weight: 700;
			color: #1e293b;
			margin-bottom: 1rem;
		}

		.subtle-box {
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			border-radius: 0.75rem;
		}

		.photo-frame {
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			border-radius: 0.75rem;
			padding: 0.5rem;
			height: 100%;
		}

		.photo-frame img {
			width: 100%;
			height: 220px;
			object-fit: cover;
			border-radius: 0.5rem;
		}

		.review-card {
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			border-radius: 0.9rem;
		}

		.link-button {
			text-decoration: none;
		}

		.favorite-form {
			display: inline-block;
		}

		.empty-box {
			background: #f8fafc;
			border: 1px dashed #cbd5e1;
			border-radius: 0.9rem;
			color: #64748b;
		}
	</style>
</head>

<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);">

    <header class="bg-white border-bottom py-3">
        <div class="container">
            <a th:href="@{/}" class="text-decoration-none fw-bold d-inline-flex align-items-center"
                style="font-family: 'Nunito', sans-serif; color: #1e293b; font-size: 1.1rem;">
                <i class="bi bi-geo-alt me-1" style="color: #2563eb;"></i>長堀橋さんぽ
            </a>
        </div>
    </header>

    <main class="flex-grow-1 pt-3 pb-4 pb-md-5">
        <div class="container" style="max-width: 1100px;">
            <div class="mb-3 ms-4">
                <button type="button" onclick="history.back()" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>戻る
                </button>
            </div>
            <div class="detail-card p-4 p-md-5 mb-4">
                <div class="mb-4">

                    <p class="text-secondary mb-2" style="font-size: 0.875rem;">スポット詳細</p>

                    <!-- タイトル行: スポット名 + お気に入りボタン -->
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <h1 class="fw-bold mb-2" style="font-size: 2rem; color: #1e293b;"
                            th:text="${spotDetail.spotName}">スポット名</h1>

                        <div class="d-flex gap-2 flex-shrink-0">

                            <th:block sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/admin/spot/edit/{id}(id=${spotDetail.id})}"
                                    class="btn rounded-pill fw-semibold"
                                    style="background:#2563eb; color:#fff; border:none; padding:0.4rem 1.1rem; font-size:0.9rem;">
                                    <i class="bi bi-pencil me-1"></i>管理者編集
                                </a>
                                <a th:href="@{/admin/spot/{id}/photo(id=${spotDetail.id})}"
                                    class="btn rounded-pill fw-semibold"
                                    style="background:#0e7490; color:#fff; border:none; padding:0.4rem 1.1rem; font-size:0.9rem;">
                                    <i class="bi bi-images me-1"></i>画像編集
                                </a>
                            </th:block>

                            <th:block sec:authorize="isAnonymous()">
                                <form th:action="@{/login(returnUrl=@{/spots/{id}(id=${spotDetail.id})})}" method="get"
                                    class="favorite-form">
                                    <input type="hidden" name="returnUrl" th:value="'/spot/' + ${spotDetail.id}">
                                    <button type="submit" class="btn rounded-pill fw-semibold"
                                        style="background:#1e293b; color:#fff; border:none; padding:0.4rem 1.1rem; font-size:0.9rem;">
                                        <i class="bi bi-heart me-1" style="color:#f87171;"></i>ログインしてお気に入りに追加
                                    </button>
                                </form>
                            </th:block>
                            <th:block sec:authorize="isAuthenticated()">
                                <th:block th:if="${isFavorite}">
                                    <form th:action="@{/favorite/remove/{spotId}(spotId=${spotDetail.id})}"
                                        method="post" class="favorite-form">
                                        <input type="hidden" name="spotId" th:value="${spotId}">
                                        <button type="submit" class="btn rounded-pill fw-semibold"
                                            style="background:#fff0f0; color:#991b1b; border:1px solid #fca5a5; padding:0.4rem 1.1rem; font-size:0.9rem;">
                                            <i class="bi bi-heart-fill me-1" style="color:#991b1b;"></i>お気に入り解除
                                        </button>
                                    </form>
                                </th:block>

                                <th:block th:unless="${isFavorite}">
                                    <form th:action="@{/favorite/add/{spotId}(spotId=${spotDetail.id})}" method="post"
                                        class="favorite-form">
                                        <input type="hidden" name="spotId" th:value="${spotId}">
                                        <button type="submit" class="btn rounded-pill fw-semibold"
                                            style="background:#1e293b; color:#fff; border:none; padding:0.4rem 1.1rem; font-size:0.9rem;">
                                            <i class="bi bi-heart me-1" style="color:#f87171;"></i>お気に入り登録
                                        </button>
                                    </form>
                                </th:block>
                            </th:block>
                        </div><!-- /ボタングループ -->
                    </div>

                    <!-- バッジ・キーワード行 -->
                    <div class="d-flex flex-column gap-2 mt-3">
                        <div class="d-flex align-items-center flex-wrap gap-2">
                            <span class="rounded-pill d-inline-flex align-items-center gap-1"
                                style="background:#dbeafe; color:#1d4ed8; font-size:0.9rem; padding:0.35rem 0.9rem;">
                                <span class="fw-bold" th:text="${spotDetail.categoryName}">カテゴリ名</span>
                                <span style="opacity:0.6;">/</span>
                                <span th:text="${spotDetail.subCategoryName}">サブカテゴリ名</span>
                            </span>
                            <span class="d-flex align-items-center gap-1" style="font-size:0.9rem;">
                                <i class="bi bi-star-fill" style="color:#f59e0b;"></i>
                                <span class="fw-bold" th:text="${spotDetail.averageRating}">0.0</span>
                            </span>
                            <span class="text-secondary" style="font-size:0.875rem;">
                                (<span th:text="${spotDetail.reviewCount}">0</span>件のレビュー)
                            </span>
                        </div>
                        <div th:if="${spotDetail.keywords != null and !#strings.isEmpty(spotDetail.keywords)}"
                            class="d-flex flex-wrap gap-1">
                            <span th:each="kw, stat : ${#strings.arraySplit(spotDetail.keywords, ',')}"
                                th:if="${stat.index < 5}" class="badge rounded-pill"
                                style="background:#f1f5f9; color:#475569; font-weight:400; font-size:0.8rem;"
                                th:text="${'#' + #strings.trim(kw)}">タグ</span>
                        </div>
                    </div>
                </div><!-- /mb-4 -->

                <div class="row g-4">
                    <div class="col-lg-7">
                        <div class="subtle-box p-4 h-100">

                            <div th:if="${spotDetail.images != null and !#lists.isEmpty(spotDetail.images)}"
                                class="mb-4">
                                <div class="photo-frame">
                                    <img th:src="${'/uploads/' + spotDetail.images[0].photoUrl}" alt="スポット画像"
                                        style="width: 100%; height: 320px; object-fit: cover; border-radius: 0.5rem;">
                                </div>
                            </div>

                            <p class="info-label">説明</p>
                            <p class="info-value" th:text="${spotDetail.details}">詳細説明</p>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="subtle-box p-4 h-100">
                            <div class="mb-3">
                                <p class="info-label">営業時間</p>
                                <p class="info-value" th:text="${spotDetail.businessHours}">営業時間</p>
                            </div>
                            <div class="mb-3">
                                <p class="info-label">予算</p>
                                <p class="info-value" th:text="${spotDetail.estimatedBudget}">予算</p>
                            </div>
                            <div class="mb-3">
                                <p class="info-label">住所</p>
                                <p class="info-value" th:text="${spotDetail.address}">住所</p>
                            </div>
                            <div class="d-flex flex-column gap-2">
								<div th:if="${spotDetail.gmapUrl != null}" class="mt-3">
									<iframe th:src="${spotDetail.gmapUrl}" width="100%" height="350" style="border:0;"
										loading="lazy">
									</iframe>
								</div>
								<a th:if="${spotDetail.websiteUrl != null}" th:href="${spotDetail.websiteUrl}"
									target="_blank" class="btn btn-outline-secondary fw-semibold link-button">
									<i class="bi bi-globe2 me-1"></i>公式サイトを見る
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="section-card p-4 p-md-5 mb-4">
				<h2 class="section-title">
					<i class="bi bi-images me-2 text-primary"></i>画像一覧
				</h2>
				<div th:if="${spotDetail.images != null and spotDetail.images.size() > 1}" class="row g-3">
					<div th:each="image, stat : ${spotDetail.images}" th:if="${stat.index > 0}"
						class="col-12 col-sm-6 col-lg-4">
						<div class="photo-frame">
							<img th:src="${'/uploads/' + image.photoUrl}" alt="スポット画像">
						</div>
					</div>
				</div>

				<div th:if="${spotDetail.images == null or #lists.isEmpty(spotDetail.images) or spotDetail.images.size() == 1}"
					class="empty-box p-4 text-center">
					<i class="bi bi-image fs-3 d-block mb-2"></i>
					画像はありません。
				</div>
			</div>


			<div class="section-card p-4 p-md-5 mb-4">
				<h2 class="section-title">
					<i class="bi bi-pencil-square me-2 text-primary"></i>レビュー投稿
				</h2>

				<!-- ログイン中のみ投稿フォームを表示 -->
				<div sec:authorize="isAuthenticated()" class="subtle-box p-4">
					<h5 class="fw-bold mb-3" style="color: #1e293b;">レビューを投稿する</h5>

					<form th:action="@{/review/post/{id}(id=${spotDetail.id})}" method="post">
						<!-- 評価 -->
						<div class="mb-3">
							<label class="form-label fw-semibold" style="font-size: 0.875rem;">評価</label>
							<select name="rating" class="form-select"
								style="border-color: #e5e7eb; background: #f9fafb;">
								<option value="5">★★★★★</option>
								<option value="4">★★★★☆</option>
								<option value="3">★★★☆☆</option>
								<option value="2">★★☆☆☆</option>
								<option value="1">★☆☆☆☆</option>
							</select>
						</div>

						<!-- コメント -->
						<div class="mb-3">
							<label class="form-label fw-semibold" style="font-size: 0.875rem;">コメント</label>
							<textarea name="comment" class="form-control" rows="4"
								style="border-color: #e5e7eb; background: #f9fafb;"
								placeholder="レビューを入力してください"></textarea>
						</div>

						<button class="btn btn-primary fw-semibold px-4" type="submit">
							<i class="bi bi-send me-1"></i>投稿する
						</button>
					</form>
				</div>

				<!-- 未ログイン時の案内 -->
				<div sec:authorize="isAnonymous()" class="alert alert-info mb-0">
					レビューを投稿するには
					<a th:href="@{/login(returnUrl=@{/spot/{id}(id=${spotDetail.id})})}"
						class="fw-semibold ms-1">ログイン</a>
					してください
				</div>
			</div>

			<div class="section-card p-4 p-md-5">
				<h2 class="section-title">
					<i class="bi bi-chat-left-text me-2 text-primary"></i>レビュー一覧
				</h2>

				<div th:if="${spotDetail.reviews != null and !#lists.isEmpty(spotDetail.reviews)}" class="d-grid gap-3">
					<div th:each="review : ${spotDetail.reviews}" th:id="'review-' + ${review.id}"
						class="review-card p-4">

						<!-- 編集中ではないレビューは通常表示 -->
						<th:block th:if="${editReviewId == null or editReviewId != review.id}">
							<div
								class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
								<div class="d-flex align-items-center gap-2">
									<div class="rounded-circle d-flex align-items-center justify-content-center"
										style="width: 42px; height: 42px; background: #dbeafe; color: #2563eb;">
										<i class="bi bi-person-fill"></i>
									</div>
									<div>
										<p class="mb-0 fw-bold" style="color: #1e293b;"
											th:text="${review.reviewerName}">
											投稿者名
										</p>

										<!-- 自分のレビューだけ編集・削除ボタンを表示 -->
										<th:block th:if="${review.isMyReview}">
											<div class="d-flex gap-2 mt-1">
												<a th:href="@{'/spot/' + ${spotDetail.id} + '?editReviewId=' + ${review.id} + '#review-' + ${review.id}}"
													class="btn btn-sm btn-outline-primary">
													編集
												</a>

												<form th:action="@{/review/{id}/delete(id=${review.id})}" method="post"
													onsubmit="return confirm('このレビューを削除しますか？');">
													<button type="submit" class="btn btn-sm btn-outline-danger">
														削除
													</button>
												</form>



											</div>
										</th:block>

										<div sec:authorize="hasRole('ADMIN')"
											class="d-flex align-items-center gap-2 ms-2">
											<form th:action="@{/admin/review/delete/form-spot}"
												method="post" onsubmit="return confirm('このレビューを削除しますか？');">
												<input type="hidden" name="reviewId" th:value="${review.id}">
												<input type="hidden" name="spotId" th:value="${spotDetail.id}">
												<button type="submit" class="btn btn-sm btn-outline-danger">
													削除
												</button>
											</form>
										</div>

										<p class="mb-0 text-secondary" style="font-size: 0.85rem;">
											<span th:text="${#temporals.format(review.reviewDate, 'yyyy/MM/dd HH:mm')}">
												2026/04/02 10:46
											</span>
										</p>
									</div>
								</div>

								<div class="rating-badge">
									<i class="bi bi-star-fill"></i>
									<span th:text="${review.rating}">5</span>
								</div>
							</div>

							<p class="mb-0" style="color: #334155; line-height: 1.8;" th:text="${review.comment}">
								レビュー本文
							</p>
						</th:block>

						<!-- 編集中のレビューだけフォーム表示 -->
						<th:block th:if="${editReviewId != null and editReviewId == review.id}">
							<form th:action="@{/review/{id}/update(id=${review.id})}" method="post">

								<input type="hidden" name="spotId" th:value="${spotDetail.id}">

								<div class="mb-3">
									<label class="form-label fw-semibold" style="font-size: 0.875rem;">評価</label>
									<select name="rating" class="form-select"
										style="border-color: #e5e7eb; background: #f9fafb;">
										<option value="5" th:selected="${review.rating == 5}">★★★★★</option>
										<option value="4" th:selected="${review.rating == 4}">★★★★☆</option>
										<option value="3" th:selected="${review.rating == 3}">★★★☆☆</option>
										<option value="2" th:selected="${review.rating == 2}">★★☆☆☆</option>
										<option value="1" th:selected="${review.rating == 1}">★☆☆☆☆</option>
									</select>
								</div>

								<div class="mb-3">
									<label class="form-label fw-semibold" style="font-size: 0.875rem;">コメント</label>
									<textarea name="comment" class="form-control" rows="4"
										style="border-color: #e5e7eb; background: #f9fafb;"
										th:text="${review.comment}"></textarea>
								</div>

								<div class="d-flex gap-2">
									<button class="btn btn-primary fw-semibold px-4" type="submit">
										更新する
									</button>
									<a th:href="@{'/spot/' + ${spotDetail.id} + '#review-' + ${review.id}}"
										class="btn btn-outline-secondary px-4">
										キャンセル
									</a>
								</div>
							</form>
						</th:block>

					</div>
				</div>

				<div th:if="${spotDetail.reviews == null or #lists.isEmpty(spotDetail.reviews)}"
					class="empty-box p-4 text-center">
					<i class="bi bi-chat-square-text fs-3 d-block mb-2"></i>
					レビューはありません。
				</div>
			</div>

		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
