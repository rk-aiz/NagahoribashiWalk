<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title th:text="${spotDetail.spotName} + ' | スポット詳細'">スポット詳細</title>
</head>
<body>
	<main class="flex-grow-1" style="background-color: #f8fafc;">
		<h1 th:text="${spotDetail.spotName}">スポット名</h1>

		<div>
			<p>
				<strong>カテゴリ：</strong>
				<span th:text="${spotDetail.categoryName}">カテゴリ名</span>
			</p>
			<p>
				<strong>サブカテゴリ：</strong>
				<span th:text="${spotDetail.subCategoryName}">サブカテゴリ名</span>
			</p>
			<p>
				<strong>説明：</strong>
				<span th:text="${spotDetail.details}">詳細説明</span>
			</p>
			<p>
				<strong>営業時間：</strong>
				<span th:text="${spotDetail.businessHours}">営業時間</span>
			</p>
			<p>
				<strong>予算：</strong>
				<span th:text="${spotDetail.estimatedBudget}">予算</span>
			</p>
			<p>
				<strong>住所：</strong>
				<span th:text="${spotDetail.address}">住所</span>
			</p>
			<p>
				<strong>平均評価：</strong>
				<span th:text="${spotDetail.averageRating}">0.0</span>
			</p>
			<p>
				<strong>レビュー件数：</strong>
				<span th:text="${spotDetail.reviewCount}">0</span>
			</p>
			<p>
				<strong>Google Map：</strong>
				<a th:href="${spotDetail.gmapUrl}" target="_blank">地図を見る</a>
			</p>
			<p>
				<strong>公式サイト：</strong>
				<a th:href="${spotDetail.websiteUrl}" target="_blank">公式サイトを見る</a>
			</p>
		</div>

		<hr>

		<h2>画像一覧</h2>
		<div th:if="${spotDetail.images != null and !#lists.isEmpty(spotDetail.images)}">
			<div th:each="image : ${spotDetail.images}">
				<img th:src="${image.photoUrl}" alt="スポット画像" style="max-width: 300px;">
			</div>
		</div>
		<div th:if="${spotDetail.images == null or #lists.isEmpty(spotDetail.images)}">
			<p>画像はありません。</p>
		</div>

		<hr>

		<h2>レビュー一覧</h2>
		<div th:if="${spotDetail.reviews != null and !#lists.isEmpty(spotDetail.reviews)}">
			<div th:each="review : ${spotDetail.reviews}">
				<p>
					<strong>投稿者：</strong>
					<span th:text="${review.reviewerName}">投稿者名</span>
				</p>
				<p>
					<strong>投稿日：</strong>
					<span th:text="${#temporals.format(review.reviewDate, 'yyyy/MM/dd HH:mm')}">2026/04/02 10:46</span>
				</p>
				<p>
					<strong>評価：</strong>
					<span th:text="${review.rating}">5</span>
				</p>
				<p>
					<strong>コメント：</strong>
					<span th:text="${review.comment}">レビュー本文</span>
				</p>
				<hr>
			</div>
		</div>
		<div th:if="${spotDetail.reviews == null or #lists.isEmpty(spotDetail.reviews)}">
			<p>レビューはありません。</p>
		</div>

	</main>
</body>
</html>
