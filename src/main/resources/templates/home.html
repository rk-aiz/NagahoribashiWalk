<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/default :: layout('トップ', ~{::main}, ~{})}" xml:lang="ja">

<head>
    <title>トップ</title>
</head>

<body>
    <main class="flex-grow-1">
        <link rel="stylesheet" th:href="@{/css/home.css}">

        <!--/* ヒーローセクション */-->
        <section class="hero">
            <div class="hero-slide active" style="background-image: url('/images/n_photo_01.jpg');"></div>
            <div class="hero-slide" style="background-image: url('/images/n_photo_02.jpg');"></div>
            <div class="hero-slide" style="background-image: url('/images/n_photo_03.jpg');"></div>
            <div class="hero-content">


                <!-- おみくじバナー（コンテンツ領域の右上） */-->
                <!--/*
                <a th:href="@{/fortune}" class="omikuji-banner">

                    <th:block th:if="${drawnToday}">
                        <span class="omikuji-banner-icon">🐙</span>
                        <div class="omikuji-banner-body">
                            <span class="omikuji-banner-main">おみくじ結果</span>
                            <span class="omikuji-banner-label">翌日0時以降に再抽選できます</span>
                        </div>
                    </th:block>

                    <th:block th:unless="${drawnToday}">
                        <span class="omikuji-banner-icon">🐙</span>
                        <div class="omikuji-banner-body">
                            <span class="omikuji-banner-label">最高10000pt当たる！</span>
                            <span class="omikuji-banner-main">おみくじ</span>
                        </div>
                    </th:block>

                </a>
                */-->
                <h1 class="hero-title">
                    <i class="bi bi-geo-alt"></i>
                    長堀橋さんぽ
                </h1>
                <p class="hero-subtitle">長堀橋駅周辺の魅力を発見しよう</p>

                <form th:action="@{/spot/search}" method="get" class="search-bar">
                    <input type="text" name="q" placeholder="キーワード検索...">
                    <button type="submit">
                        <i class="bi bi-search"></i> 検索
                    </button>
                </form>
            </div>
        </section>

        <script>
            (function () {
                const slides = document.querySelectorAll('.hero-slide');
                let current = 0;
                setInterval(function () {
                    slides[current].classList.remove('active');
                    current = (current + 1) % slides.length;
                    slides[current].classList.add('active');
                }, 7000);
            })();
        </script>

        <!--/* おすすめスポット3件表示 */-->
        <th:block th:replace="~{fragments/spot-card :: styles}"></th:block>
        <section class="container my-5">
            <h3 class="mb-4 text-center">おすすめスポット</h3>
            <div class="row g-4">
                <div class="col-md-4" th:each="spot : ${spots}">
                    <th:block th:replace="~{fragments/spot-card :: card(${spot}, '/')}"></th:block>
                </div>
            </div>
        </section>

        <!--/* 長堀橋エリア紹介 */-->
        <section style="background-color: #f8fafc;" class="py-5">
            <div class="container text-center" style="max-width: 720px;">
                <h4 class="mb-4">長堀橋エリアについて</h3>
                    <p class="text-muted lh-lg">
                        大阪市営地下鉄長堀橋駅周辺は、ビジネス街と商業施設が融合した活気あるエリアです。
                        地下街「クリスタ長堀」をはじめ、多様な飲食店、カフェ、ショップが軒を連ね、
                        歴史ある神社や緑豊かな公園も点在しています。
                        このサイトでは、長堀橋周辺の魅力的なスポットをご紹介します。
                    </p>
            </div>
        </section>
    </main>
</body>

</html>
