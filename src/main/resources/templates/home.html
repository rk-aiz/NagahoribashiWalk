<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長堀橋さんぽ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .site-logo {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #1d4ed8;
            text-decoration: none;
        }

        .site-logo i {
            font-size: 1.3rem;
        }

        /* カテゴリナビ */
        .category-nav {
            background: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            gap: 3rem;
            padding: 0.6rem 0;
        }

        .category-nav a {
            color: #374151;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .category-nav a:hover {
            color: #2563eb;
        }

        /* ヒーローセクション */
        .hero {
            position: relative;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('/images/hero.jpg') center/cover no-repeat;
            color: #fff;
            text-align: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            padding: 0 1rem;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .hero-subtitle {
            font-size: 1rem;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        /* 検索バー */
        .search-bar {
            display: flex;
            background: #fff;
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            color: #374151;
        }

        .search-bar button {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 9999px;
            padding: 0.75rem 1.75rem;
            font-size: 0.95rem;
            margin: 0.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .search-bar button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <!-- カテゴリナビ -->
    <nav class="category-nav" aria-label="カテゴリナビゲーション">
        <a th:href="@{/spot/category/1}">グルメ</a>
        <a th:href="@{/spot/category/2}">観光スポット</a>
        <a th:href="@{/spot/category/3}">ショッピング</a>
        <a th:href="@{/spot/category/4}">娯楽</a>
        <a th:href="@{/spot/category/5}">その他</a>
    </nav>

    <!-- ヒーローセクション -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">
                <i class="bi bi-geo-alt"></i>
                長堀橋さんぽ
            </h1>
            <p class="hero-subtitle">長堀橋駅周辺の魅力を発見しよう</p>

            <form th:action="@{/spot/search}" method="get" class="search-bar">
                <input type="text" name="q" placeholder="キーワード検索...">
                <button type="submit">
                    <i class="bi bi-search"></i> 検索
                </button>
            </form>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
