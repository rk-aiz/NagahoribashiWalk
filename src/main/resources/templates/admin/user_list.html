<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー管理</title>

    <!-- Bootstrap（任意） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">ユーザー一覧（管理者）</h2>

<!-- ===================== -->
<!-- ユーザーテーブル -->
<!-- ===================== -->
<table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>ユーザー名</th>
            <th>表示名</th>
            <th>メール</th>
            <th>権限</th>
            <th>作成日時</th>
            <th>更新日時</th>
            <th>状態</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="user : ${page.content}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.displayName}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>

            <!-- 日付 -->
            <td th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
            <td th:text="${#temporals.format(user.updatedAt, 'yyyy/MM/dd HH:mm')}"></td>

            <!-- 有効フラグ -->
            <td>
                <span class="badge bg-success" th:if="${user.enabled}">有効</span>
                <span class="badge bg-secondary" th:unless="${user.enabled}">無効</span>
            </td>

            <!-- 操作 -->
            <td>
                <!-- 有効/無効切り替え -->
                <form th:action="@{/admin/users/toggle}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${user.id}">
                    <button class="btn btn-sm btn-warning">切替</button>
                </form>

                <!-- 削除 -->
                <form th:action="@{/admin/users/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${user.id}">
                    <button class="btn btn-sm btn-danger"
                            onclick="return confirm('削除しますか？');">
                        削除
                    </button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

<!-- ===================== -->
<!-- ページネーション -->
<!-- ===================== -->
<nav th:if="${page.totalPages > 1}">
    <ul class="pagination justify-content-center">

        <!-- 前へ -->
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/users(page=${page.number - 1})}">
                前
            </a>
        </li>

        <!-- ページ番号 -->
        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link"
               th:href="@{/admin/users(page=${i})}"
               th:text="${i + 1}">
            </a>
        </li>

        <!-- 次へ -->
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link"
               th:href="@{/admin/users(page=${page.number + 1})}">
                次
            </a>
        </li>

    </ul>
</nav>

</body>
</html>
