<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者トップ - 長堀橋さんぽ</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f8fafc;
        }

        .admin-card {
            border-radius: 1rem;
            transition: all 0.25s ease;
            height: 100%;
        }

        .admin-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .admin-icon {
            font-size: 2.8rem; /* 少し大きく */
            margin-bottom: 14px;
        }

        /* 薄い3原色 */
        .card-blue {
            background-color: #e0f2fe;
        }

        .card-green {
            background-color: #dcfce7;
        }

        .card-red {
            background-color: #fee2e2;
        }

        /* カードサイズUP */
        .admin-card p {
            font-size: 0.95rem;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- ヘッダー（元の左寄せに戻す） -->
    <header class="bg-white border-bottom py-3">
        <div class="container">
            <a th:href="@{/}" class="text-decoration-none fw-bold d-inline-flex align-items-center"
               style="color: #1e293b; font-size: 1.1rem;">
                <i class="bi bi-geo-alt me-1 text-primary"></i>
                長堀橋さんぽ（管理者）
            </a>
        </div>
    </header>

    <!-- メイン -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">

        <div class="container">

            <!-- タイトル（1.5倍） -->
            <div class="text-center mb-5">
                <h1 class="fw-bold text-dark" style="font-size: 2.2rem;">
                    管理者トップ
                </h1>
                <p class="text-secondary" style="font-size: 1.1rem;">
                    操作したいメニューを選択してください
                </p>
            </div>

            <!-- 中央寄せ -->
            <div class="row justify-content-center g-4">

                <!-- スポット新規登録 -->
                <div class="col-md-4 col-lg-4">
                    <a href="/admin/spot/new" class="card-link">
                        <div class="admin-card card-blue text-center p-5">
                            <div class="admin-icon text-primary">
                                <i class="bi bi-plus-circle"></i>
                            </div>
                            <h4 class="fw-bold">スポット新規登録</h4>
                            <p class="text-secondary">
                                新しいスポットを登録します
                            </p>
                        </div>
                    </a>
                </div>

                <!-- スポット一覧 -->
                <div class="col-md-4 col-lg-4">
                    <a href="/admin/spot/list" class="card-link">
                        <div class="admin-card card-green text-center p-5">
                            <div class="admin-icon text-success">
                                <i class="bi bi-card-list"></i>
                            </div>
                            <h4 class="fw-bold">スポット一覧</h4>
                            <p class="text-secondary">
                                登録済みスポットを確認・編集
                            </p>
                        </div>
                    </a>
                </div>

                <!-- ユーザー管理 -->
                <div class="col-md-4 col-lg-4">
                    <a href="/admin/user/list" class="card-link">
                        <div class="admin-card card-red text-center p-5">
                            <div class="admin-icon text-danger">
                                <i class="bi bi-people"></i>
                            </div>
                            <h4 class="fw-bold">ユーザー管理</h4>
                            <p class="text-secondary">
                                ユーザーの確認・削除を行います
                            </p>
                        </div>
                    </a>
                </div>

            </div>

        </div>

    </main>

</body>

</html>
