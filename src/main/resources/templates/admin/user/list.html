<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ユーザー管理 - 長堀橋さんぽ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
        }

        .page-card {
            background: #ffffff;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .table thead {
            background: #f1f5f9;
        }

        .btn-soft {
            border-radius: 0.5rem;
        }

        .action-btns form {
            display: inline;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- ヘッダー -->
<header class="bg-white border-bottom py-3">
    <div class="container">
        <a th:href="@{/}" class="text-decoration-none fw-bold d-inline-flex align-items-center"
           style="color: #1e293b;">
            <i class="bi bi-geo-alt me-1 text-primary"></i>
            長堀橋さんぽ（管理者）
        </a>
    </div>
</header>

<!-- メイン -->
<main class="flex-grow-1 py-5">
    <div class="container">

        <!-- 戻る＋ソート -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-soft">
                <i class="bi bi-arrow-left"></i> 管理トップへ
            </a>

            <div>
                <a th:href="@{/admin/user/list(sort='asc')}"
                   class="btn btn-outline-primary btn-sm btn-soft">
                    <i class="bi bi-sort-numeric-down"></i> 昇順
                </a>

                <a th:href="@{/admin/user/list(sort='desc')}"
                   class="btn btn-outline-primary btn-sm btn-soft">
                    <i class="bi bi-sort-numeric-up"></i> 降順
                </a>
            </div>
        </div>

        <!-- タイトル -->
        <div class="mb-4">
            <h2 class="fw-bold">ユーザー管理</h2>
            <p class="text-secondary small mb-0">ユーザーの状態変更・削除ができます</p>
        </div>

        <!-- カード -->
        <div class="page-card">

            <!-- テーブル -->
            <div class="table-responsive">
                <table class="table table-hover align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ユーザー名</th>
                            <th>表示名</th>
                            <th>メール</th>
                            <th>権限</th>
                            <th>作成日時</th>
                            <th>状態</th>
                            <th class="text-center">操作</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="user : ${page.content}">

                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td th:text="${user.displayName}"></td>
                            <td th:text="${user.email}"></td>
                            <td>
                                <span class="badge bg-secondary" th:text="${user.role}"></span>
                            </td>

                            <td th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd')}"></td>

                            <!-- 状態 -->
                            <td>
                                <span class="badge bg-success" th:if="${user.enabled}">有効</span>
                                <span class="badge bg-secondary" th:unless="${user.enabled}">無効</span>
                            </td>

                            <!-- 操作 -->
                            <td class="text-center action-btns">

                                <!-- 切替 -->
                                <form th:action="@{/admin/user/toggle}" method="post">
                                    <input type="hidden" name="id" th:value="${user.id}">
                                    <input type="hidden" name="page" th:value="${page.number}">
                                    <input type="hidden" name="sort" th:value="${sort}">

                                    <button class="btn btn-sm btn-outline-warning btn-soft"
                                            th:unless="${#authentication.name == user.username}">
                                        切替
                                    </button>
                                </form>

                                <!-- 削除 -->
                                <form th:action="@{/admin/user/delete}" method="post"
                                      onsubmit="return confirm('削除しますか？');">

                                    <input type="hidden" name="username" th:value="${user.username}">
                                    <input type="hidden" name="page" th:value="${page.number}">
                                    <input type="hidden" name="sort" th:value="${sort}">
                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button class="btn btn-sm btn-outline-danger btn-soft"
                                            th:unless="${#authentication.name == user.username}">
                                        削除
                                    </button>
                                </form>

                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </div>

        <!-- ページネーション -->
        <nav class="mt-4" th:if="${page.totalPages > 1}">
            <ul class="pagination justify-content-center">

                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/user/list(page=${page.number - 1}, sort=${sort})}">
                        前
                    </a>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/admin/user/list(page=${i}, sort=${sort})}"
                       th:text="${i + 1}">
                    </a>
                </li>

                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/user/list(page=${page.number + 1}, sort=${sort})}">
                        次
                    </a>
                </li>

            </ul>
        </nav>

    </div>
</main>

</body>
</html>
