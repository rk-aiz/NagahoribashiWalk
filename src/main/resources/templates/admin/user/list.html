<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: layout('ユーザー管理', 'ユーザー管理', ~{}, ~{::main})}"
    xml:lang="ja">

<head>
    <title>ユーザー管理 - 長堀橋さんぽ 管理画面</title>
</head>


<main th:fragment="content">

    <!--/* 検索用 */-->
    <form th:action="@{/admin/user/list}" method="get"
        class="mb-4 d-flex justify-content-center align-items-center gap-2">

        <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-md"
            style="max-width: 320px;" placeholder="ユーザー名・メールで検索">
        <input type="hidden" name="sort" th:value="${sort}">

        <button type="submit" class="btn btn-md btn-primary px-3">
            <i class="bi bi-search me-1"></i> 検索
        </button>

        <div class="form-check form-switch ms-2">
            <input class="form-check-input" type="checkbox" role="switch" id="includeDeletedToggle"
                name="includeDeleted" aria-checked="false" th:checked="${includeDeleted}"
                th:attr="aria-checked=${includeDeleted}" onchange="this.form.submit()" style="cursor: pointer;">
            <label class="form-check-label small" for="includeDeletedToggle" style="cursor: pointer;">退会ユーザー含む</label>
        </div>

    </form>

    <div class="container" style="max-width: 1100px;">

        <!--/* ページネーション */-->
        <nav class="mt-4" th:if="${page.totalPages > 1}">
            <ul class="pagination justify-content-center admin-pagination">

                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/admin/user/list(page=${page.number - 1}, sort=${sort}, keyword=${keyword}, includeDeleted=${includeDeleted})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? 'active'"><a class="page-link"
                        th:href="@{/admin/user/list(page=${i}, sort=${sort}, keyword=${keyword}, includeDeleted=${includeDeleted})}"
                        th:text="${i + 1}"> </a></li>

                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/admin/user/list(page=${page.number + 1}, sort=${sort}, keyword=${keyword}, includeDeleted=${includeDeleted})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>

            </ul>
        </nav>

        <div class="admin-card">
            <div class="p-4">

                <!--/* タイトル + ソートボタン */-->
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div>
                        <h5 class="fw-bold mb-0">ユーザー一覧</h5>
                        <p class="mb-0 mt-1" style="font-size: 0.8rem; color: #94a3b8;">
                            ユーザーの有効/無効切り替え・削除ができます</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/admin/user/list(sort='asc', keyword=${keyword}, includeDeleted=${includeDeleted})}"
                            class="btn btn-sm btn-outline-primary"> <i class="bi bi-sort-numeric-down me-1"></i>ID昇順
                        </a> <a
                            th:href="@{/admin/user/list(sort='desc', keyword=${keyword}, includeDeleted=${includeDeleted})}"
                            class="btn btn-sm btn-outline-primary"> <i class="bi bi-sort-numeric-up me-1"></i>ID降順
                        </a>
                    </div>
                </div>

                <!--/* テーブル */-->
                <div class="table-responsive">
                    <table class="table table-borderless align-middle mb-0 admin-table">
                        <thead>
                            <tr>
                                <th class="text-center" scope="col" style="width: 60px;">ID</th>
                                <th scope="col" style="min-width: 120px;">ユーザー名</th>
                                <th scope="col" style="min-width: 120px;">表示名</th>
                                <th scope="col" style="min-width: 180px;">メール</th>
                                <th class="text-center" scope="col" style="width: 90px;">権限</th>
                                <th class="text-center" scope="col" style="width: 110px;">作成日</th>
                                <th class="text-center" scope="col" style="width: 80px;">状態</th>
                                <th class="text-center" scope="col" style="width: 120px;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${page.content}"
                                th:classappend="${!user.enabled or user.deletedAt != null} ? 'user-row-muted'">

                                <td class="small text-center" style="color: #94a3b8; font-weight: bold;"
                                    th:text="${user.id}"></td>
                                <td class="small" style="word-break: break-all;" th:text="${user.username}"></td>
                                <td class="small" style="word-break: break-all;" th:text="${user.displayName}"></td>
                                <td class="small" style="color: #64748b; font-size: 0.8rem; word-break: break-all;"
                                    th:text="${user.email}"></td>

                                <!--/* 権限バッジ */-->
                                <td class="text-center"><span class="badge rounded-pill px-2 py-1 fw-normal"
                                        th:text="${user.role}" th:style="${user.role == 'ADMIN'}
                                              ? 'background-color: #dbeafe; color: #1d4ed8;'
                                              : 'background-color: #f1f5f9; color: #475569;'">
                                    </span></td>

                                <td class="text-center" style="color: #64748b; font-size: 0.875rem;"
                                    th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd')}"></td>

                                <!--/* 状態バッジ */-->
                                <td class="text-center">
                                    <th:block th:if="${user.deletedAt != null}">
                                        <span class="badge rounded-pill px-2 py-1 fw-normal"
                                            style="background-color: #fee2e2; color: #991b1b;">退会</span>
                                    </th:block>
                                    <th:block th:unless="${user.deletedAt != null}">
                                        <span th:if="${user.enabled}" class="badge rounded-pill px-2 py-1 fw-normal"
                                            style="background-color: #dcfce7; color: #166534;">有効</span>
                                        <span th:unless="${user.enabled}" class="badge rounded-pill px-2 py-1 fw-normal"
                                            style="background-color: #f1f5f9; color: #475569;">無効</span>
                                    </th:block>
                                </td>

                                <!--/* 操作 */-->
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-1">

                                        <!--/* 有効/無効切り替え */-->
                                        <form th:action="@{/admin/user/toggle}" method="post"
                                            class="m-0 form-switch d-flex align-items-center me-2"
                                            style="padding-left: 0;"
                                            th:unless="${#authentication.name == user.username or user.deletedAt != null}">
                                            <input type="hidden" name="id" th:value="${user.id}">
                                            <input type="hidden" name="page" th:value="${page.number}">
                                            <input type="hidden" name="sort" th:value="${sort}">
                                            <input type="hidden" name="keyword" th:value="${keyword}">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}">
                                            <input type="hidden" name="includeDeleted" th:value="${includeDeleted}">
                                            <input class="form-check-input user-toggle" type="checkbox" role="switch"
                                                aria-checked="false" th:checked="${user.enabled}"
                                                th:attr="aria-checked=${user.enabled}" onchange="this.form.submit()"
                                                style="cursor: pointer; margin: 0;" title="有効/無効を切り替え">
                                        </form>

                                        <!--/* 削除 */-->
                                        <form th:action="@{/admin/user/delete}" method="post" class="m-0"
                                            onsubmit="return confirm('削除しますか？');">
                                            <input type="hidden" name="username" th:value="${user.username}"> <input
                                                type="hidden" name="page" th:value="${page.number}"> <input
                                                type="hidden" name="sort" th:value="${sort}"> <input type="hidden"
                                                name="keyword" th:value="${keyword}">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}"> <input type="hidden" name="includeDeleted"
                                                th:value="${includeDeleted}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                                th:unless="${#authentication.name == user.username or user.deletedAt != null}"
                                                title="削除">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>

                                    </div>
                                </td>

                            </tr>

                            <!--/* データなし */-->
                            <tr th:if="${page == null or page.content.isEmpty()}">
                                <td colspan="8" class="text-center py-5" style="color: #64748b;">
                                    <i class="bi bi-people d-block mb-2" style="font-size: 1.75rem;"></i> ユーザーが登録されていません
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <!--/* ページネーション */-->
        <nav class="mt-4" th:if="${page.totalPages > 1}">
            <ul class="pagination justify-content-center admin-pagination">

                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/admin/user/list(page=${page.number - 1}, sort=${sort}, keyword=${keyword}, includeDeleted=${includeDeleted})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? 'active'"><a class="page-link"
                        th:href="@{/admin/user/list(page=${i}, sort=${sort}, keyword=${keyword}, includeDeleted=${includeDeleted})}"
                        th:text="${i + 1}"> </a></li>

                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/admin/user/list(page=${page.number + 1}, sort=${sort}, keyword=${keyword}, includeDeleted=${includeDeleted})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>

            </ul>
        </nav>

    </div>

</main>

</html>
