<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: layout('ユーザー管理', 'ユーザー管理', ~{}, ~{::main})}"
    xml:lang="ja">

<head>
    <title>ユーザー管理 - 長堀橋さんぽ 管理画面</title>
</head>

<main th:fragment="content">

    <div class="container" style="max-width: 1100px;">
        <div class="admin-card">
            <div class="p-4">

                <!-- タイトル + ソートボタン -->
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div>
                        <h5 class="fw-bold mb-0">ユーザー一覧</h5>
                        <p class="mb-0 mt-1" style="font-size: 0.8rem; color: #94a3b8;">
                            ユーザーの有効/無効切り替え・削除ができます
                        </p>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/admin/user/list(sort='asc')}" class="btn btn-sm btn-outline-light">
                            <i class="bi bi-sort-numeric-down me-1"></i>ID昇順
                        </a>
                        <a th:href="@{/admin/user/list(sort='desc')}" class="btn btn-sm btn-outline-light">
                            <i class="bi bi-sort-numeric-up me-1"></i>ID降順
                        </a>
                    </div>
                </div>

                <!-- テーブル -->
                <div class="table-responsive">
                    <table class="table table-borderless align-middle mb-0 admin-table">
                        <thead>
                            <tr>
                                <th scope="col" style="width: 60px;">ID</th>
                                <th scope="col">ユーザー名</th>
                                <th scope="col">表示名</th>
                                <th scope="col">メール</th>
                                <th scope="col" style="width: 90px;">権限</th>
                                <th scope="col" style="width: 110px;">作成日</th>
                                <th scope="col" style="width: 80px;">状態</th>
                                <th scope="col" style="width: 120px;" class="text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${page.content}">

                                <td class="small" style="color: #94a3b8;" th:text="${user.id}"></td>
                                <td class="fw-medium" th:text="${user.username}"></td>
                                <td th:text="${user.displayName}"></td>
                                <td style="color: #64748b; font-size: 0.875rem;" th:text="${user.email}"></td>

                                <!-- 権限バッジ -->
                                <td>
                                    <span class="badge rounded-pill px-2 py-1 fw-normal" th:text="${user.role}"
                                        th:style="${user.role == 'ADMIN'}
                                              ? 'background-color: #dbeafe; color: #1d4ed8;'
                                              : 'background-color: #f1f5f9; color: #475569;'">
                                    </span>
                                </td>

                                <td style="color: #64748b; font-size: 0.875rem;"
                                    th:text="${#temporals.format(user.createdAt, 'yyyy/MM/dd')}"></td>

                                <!-- 状態バッジ -->
                                <td>
                                    <span th:if="${user.enabled}" class="badge rounded-pill px-2 py-1 fw-normal"
                                        style="background-color: #dcfce7; color: #166534;">有効</span>
                                    <span th:unless="${user.enabled}" class="badge rounded-pill px-2 py-1 fw-normal"
                                        style="background-color: #f1f5f9; color: #475569;">無効</span>
                                </td>

                                <!-- 操作 -->
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-1">

                                        <!-- 有効/無効切り替え -->
                                        <form th:action="@{/admin/user/toggle}" method="post" class="m-0">
                                            <input type="hidden" name="id" th:value="${user.id}">
                                            <input type="hidden" name="page" th:value="${page.number}">
                                            <input type="hidden" name="sort" th:value="${sort}">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-sm btn-outline-warning"
                                                th:unless="${#authentication.name == user.username}" title="有効/無効を切り替え">
                                                <i class="bi bi-toggle-on"></i>
                                            </button>
                                        </form>

                                        <!-- 削除 -->
                                        <form th:action="@{/admin/user/delete}" method="post" class="m-0"
                                            onsubmit="return confirm('削除しますか？');">
                                            <input type="hidden" name="username" th:value="${user.username}">
                                            <input type="hidden" name="page" th:value="${page.number}">
                                            <input type="hidden" name="sort" th:value="${sort}">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                                th:unless="${#authentication.name == user.username}" title="削除">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>

                                    </div>
                                </td>

                            </tr>

                            <!-- データなし -->
                            <tr th:if="${page == null or page.content.isEmpty()}">
                                <td colspan="8" class="text-center py-5" style="color: #64748b;">
                                    <i class="bi bi-people d-block mb-2" style="font-size: 1.75rem;"></i>
                                    ユーザーが登録されていません
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <!-- ページネーション -->
        <nav class="mt-4" th:if="${page.totalPages > 1}">
            <ul class="pagination justify-content-center admin-pagination">

                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/user/list(page=${page.number - 1}, sort=${sort})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/user/list(page=${i}, sort=${sort})}" th:text="${i + 1}">
                    </a>
                </li>

                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/user/list(page=${page.number + 1}, sort=${sort})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>

            </ul>
        </nav>

    </div>

</main>

</html>
