<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: layout(
        ${form.isNew ? 'スポット新規登録' : 'スポット編集'},
        ${form.isNew ? 'スポット新規登録' : 'スポット編集'},
        ~{}, ~{::main}
    )}" xml:lang="ja">

<main th:fragment="content">
    <div class="container" style="max-width: 780px;">

        <!-- 戻るリンク -->
        <div class="mb-3">
            <a th:href="@{/admin/spot/list}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>一覧に戻る
            </a>
        </div>

        <!-- フォームカード -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h5 class="fw-bold mb-1" th:text="${form.isNew ? '新規スポット登録' : 'スポット編集'}">新規スポット登録</h5>
                <p class="text-muted small mb-4" th:text="${form.isNew ? '新しい観光スポットの情報を入力してください' : 'スポット情報を編集してください'}">
                    新しい観光スポットの情報を入力してください
                </p>

                <form th:action="${form.isNew ? '/admin/spot/add' : '/admin/spot/edit'}" th:object="${form}"
                    method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{isNew}" />

                    <!-- スポット名 -->
                    <div class="mb-3">
                        <label for="spotName" class="form-label fw-semibold">
                            スポット名 <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="spotName" th:field="*{spotName}" class="form-control"
                            th:classappend="${#fields.hasErrors('spotName')} ? 'is-invalid'"
                            placeholder="例：キャルITカレッジ大阪校">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('spotName')}" th:errors="*{spotName}">
                        </div>
                    </div>

                    <!-- カテゴリー ＋ 料金 -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <label for="subCategoryId" class="form-label fw-semibold">
                                カテゴリー <span class="text-danger">*</span>
                            </label>
                            <select id="subCategoryId" th:field="*{subCategoryId}" class="form-select"
                                th:classappend="${#fields.hasErrors('subCategoryId')} ? 'is-invalid'">
                                <option value="">カテゴリーを選択</option>
                                <th:block th:each="cat : ${dropDownCategories}">
                                    <optgroup th:label="${cat.name}">
                                        <option th:each="sub : ${cat.subCategories}" th:value="${sub.id}"
                                            th:text="${cat.name + ' / ' + sub.name}">サブカテゴリ</option>
                                    </optgroup>
                                </th:block>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('subCategoryId')}"
                                th:errors="*{subCategoryId}"></div>
                        </div>
                        <div class="col-md-5">
                            <label for="estimatedBudget" class="form-label fw-semibold">料金</label>
                            <input type="text" id="estimatedBudget" th:field="*{estimatedBudget}" class="form-control"
                                placeholder="例：¥1,000-3,000">
                        </div>
                    </div>

                    <!-- 住所 -->
                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">
                            住所 <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="address" th:field="*{address}" class="form-control"
                            placeholder="例：〒542-0082 大阪府大阪市中央区島之内1-4-7 3階">
                    </div>

                    <!-- 営業時間 ＋ 定休日 -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="businessHours" class="form-label fw-semibold">営業時間</label>
                            <input type="text" id="businessHours" th:field="*{businessHours}" class="form-control"
                                placeholder="例：8:30-18:00">
                        </div>
                        <div class="col-md-6">
                            <label for="closedDays" class="form-label fw-semibold">定休日</label>
                            <input type="text" id="closedDays" th:field="*{closedDays}" class="form-control"
                                placeholder="例：土日、祝日">
                        </div>
                    </div>

                    <!-- キーワード -->
                    <div class="mb-3">
                        <label for="keywords" class="form-label fw-semibold">キーワード</label>
                        <input type="text" id="keywords" th:field="*{keywords}" class="form-control"
                            placeholder="例：Java, 職業訓練, IT, プログラミング">
                        <div class="form-text">カンマ区切りで複数入力できます。検索に使用されます。</div>
                    </div>

                    <!-- 公式サイトURL -->
                    <div class="mb-3">
                        <label for="websiteUrl" class="form-label fw-semibold">公式サイトURL</label>
                        <input type="url" id="websiteUrl" th:field="*{websiteUrl}" class="form-control"
                            th:classappend="${#fields.hasErrors('websiteUrl')} ? 'is-invalid'"
                            placeholder="https://example.com">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('websiteUrl')}"
                            th:errors="*{websiteUrl}"></div>
                    </div>

                    <!-- GoogleマップURL -->
                    <div class="mb-3">
                        <label for="gmapUrl" class="form-label fw-semibold">GoogleマップURL</label>
                        <input type="url" id="gmapUrl" th:field="*{gmapUrl}" class="form-control"
                            th:classappend="${#fields.hasErrors('gmapUrl')} ? 'is-invalid'"
                            placeholder="https://maps.google.com/...">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('gmapUrl')}" th:errors="*{gmapUrl}">
                        </div>
                    </div>

                    <!-- 説明 -->
                    <div class="mb-4">
                        <label for="details" class="form-label fw-semibold">
                            説明 <span class="text-danger">*</span>
                        </label>
                        <textarea id="details" th:field="*{details}" class="form-control" rows="5"
                            placeholder="スポットの詳細な説明を入力してください"></textarea>
                    </div>

                    <!-- ボタン -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn text-white px-4" style="background-color: #7c3aed;">
                            <i class="bi bi-floppy me-1"></i>
                            <span th:text="${form.isNew ? '登録する' : '更新する'}">登録する</span>
                        </button>
                        <a th:href="@{/admin/spot/list}" class="btn btn-outline-secondary">
                            キャンセル
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</main>

</html>
