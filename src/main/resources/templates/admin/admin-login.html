<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ログイン - 長堀橋さんぽ</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f1f5f9;
        }

        .admin-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background-color: #e4e6e9;
            color: #55606d;
            border: 1px solid #b4bbcd;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            padding: 0.25rem 0.75rem;
            text-transform: uppercase;
        }

        .form-control-dark {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            border-radius: 0.5rem;
        }

        .form-control-dark::placeholder {
            color: #94a3b8;
        }

        .form-control-dark:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            color: #1e293b;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
        }

        .input-icon {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-right: none;
            color: #64748b;
            border-radius: 0.5rem 0 0 0.5rem;
        }

        .form-control-dark.border-start-0 {
            border-left: none;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .divider {
            border-color: #e2e8f0;
        }

        .form-label-dark {
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center">

    <div class="w-100" style="max-width: 420px; padding: 0 1rem;">

        <!--/* ロゴ・システム名 */-->
        <div class="text-center mb-4">
            <p class="fw-bold mb-1" style="font-size: 1.1rem; letter-spacing: 0.04em; color: #1e293b;">
                <i class="bi bi-geo-alt me-1" style="color: #3b82f6;"></i>長堀橋さんぽ
            </p>
            <span class="admin-badge">
                <i class="bi bi-shield-lock-fill"></i>
                Administration
            </span>
        </div>

        <!--/* ログインカード */-->
        <div class="admin-card p-4 p-sm-5">

            <h1 class="fw-bold mb-1" style="font-size: 1.25rem; color: #1e293b;">管理者ログイン</h1>
            <p class="mb-4" style="color: #64748b; font-size: 0.8rem;">管理者アカウントの認証情報を入力してください</p>

            <hr class="divider mb-4">

            <!--/* 権限エラー（一般ユーザーが /admin/login にアクセスした場合） */-->
            <div th:if="${param.error != null and param.error[0] == 'forbidden'}" class="alert py-2 mb-3"
                style="background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; font-size: 0.8rem;">
                <i class="bi bi-shield-x me-1"></i>
                管理者権限がありません。
            </div>

            <!--/* 認証エラー（メアド・パスワード不一致） */-->
            <div th:if="${param.error != null and param.error[0] != 'forbidden'}" class="alert py-2 mb-3"
                style="background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; font-size: 0.8rem;">
                <i class="bi bi-exclamation-triangle me-1"></i>
                メールアドレスまたはパスワードが正しくありません。
            </div>

            <!--/* ログインフォーム */-->
            <form th:action="@{/admin/authentication}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!--/* ユーザー名 */-->
                <div class="mb-3">
                    <label for="username" class="form-label form-label-dark">ユーザー名</label>
                    <div class="input-group">
                        <span class="input-group-text input-icon">
                            <i class="bi bi-person" style="font-size: 0.9rem;"></i>
                        </span>
                        <input type="text" id="username" name="username"
                            class="form-control form-control-dark border-start-0" placeholder="ユーザー名を入力"
                            autocomplete="username" value="admin" required>
                    </div>
                </div>

                <!--/* パスワード */-->
                <div class="mb-4">
                    <label for="password" class="form-label form-label-dark">パスワード</label>
                    <div class="input-group">
                        <span class="input-group-text input-icon">
                            <i class="bi bi-lock" style="font-size: 0.9rem;"></i>
                        </span>
                        <input type="password" id="password" name="password"
                            class="form-control form-control-dark border-start-0" placeholder="パスワードを入力"
                            autocomplete="current-password" value="Admin@2026" required>
                    </div>
                </div>

                <!--/* ログインボタン */-->
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>ログイン
                </button>
            </form>

            <!--/* デモ用アカウント */-->
            <div class="mt-4 p-3 rounded-3" style="background: #f8fafc; border: 1px solid #e2e8f0;">
                <p class="fw-semibold mb-1 text-dark" style="font-size: 0.8rem;">デモ用アカウント：</p>
                <p class="mb-0 text-secondary" style="font-size: 0.8rem;">ユーザー名: admin</p>
                <p class="mb-0 text-secondary" style="font-size: 0.8rem;">パスワード: Admin@2026</p>
            </div>

        </div>

        <!--/* 一般サイトへのリンク */-->
        <p class="text-center mt-4" style="color: #475569; font-size: 0.8rem;">
            <a th:href="@{/}" style="color: #475569; text-decoration: underline;">
                一般サイトへ戻る
            </a>
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
