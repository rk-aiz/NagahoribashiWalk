spring.application.name=nagahoribashi_walk

# Postgresのドライバー設定
spring.datasource.driver-class-name=org.postgresql.Driver
# データベースへの接続URLを設定
spring.datasource.url=jdbc:postgresql://localhost:5432/nagahoribashi_walkdb

# データベース接続の為のユーザー名
spring.datasource.username=nagahoribashi_walk
# データベース接続の為のパスワード
spring.datasource.password=nagahoribashi

# SQLスクリプトの初期化モードを設定
spring.sql.init.mode=never

# Log表示設定
#logging.level.com.example.nagahoribashi_walk.repository=DEBUG

# DBのカラム名(スネークケース)とJavaのフィールド名(キャメルケース)を自動変換する設定
mybatis.configuration.map-underscore-to-camel-case=true

# TomcatのPOSTデータサイズ制限を緩和 (デフォルト2MB -> 5MB)
server.tomcat.max-http-form-post-size=5MB

# マルチパートリクエストのサイズ制限も合わせて緩和
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 仮想スレッド（Java 21 + Spring Boot 3.2以降)
spring.threads.virtual.enabled=true

#外部ファイル(画像)保存先
app.upload.dir=./uploads

#本番リリーズ時はWhitelabelエラーページを無効にする
#spring.web.error.whitelabel.enabled=false

#おみくじお気に入りボーナスポイント
fortune.bonus-point=1000

#レビュー投稿ボーナスポイント
review.post-point=1000

#レビュー削除時のポイント減算ウィンドウ（時間）
review.delete-penalty-window-hours=24

# messages.propertiesのエンコーディング設定
spring.messages.encoding=UTF-8